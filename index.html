<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#0a0e14">
<title>CRM</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("crmTheme")||"dark"}catch(e){}</script>
<style>
:root{
  --bg:#0b0e18; --panel:#1a2340; --panel2:#1f2a4b; --field:#111833;
  --line:rgba(130,160,255,.18); --blue:#4db8ff; --blue-d:#ebbc5a;
  --teal:#ebbc5a; --teal-d:#c99a35; --orange:#e5605c; --grey:#8b91a1;
  --acc:#8fd0ff; --acc-d:#5fb3ec; --acc-tx:#06263d;
  --text:#f0ece4; --muted:#8b91a1; --red:#e5605c; --green:#6fd3b0; --violet:#a78bfa;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.3vw + 13px,18px);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(235,188,90,.07),transparent),var(--bg);
  color:var(--text);font:1rem/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.ico{width:1.35em;height:1.35em;flex:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-rows:1fr;height:100dvh}
#main{position:relative;overflow:hidden;display:grid;min-height:0}
.pane{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
#listPane{padding:0 .8rem 1rem}
#listPane>.empty.big{padding-top:calc(env(safe-area-inset-top) + 4rem)}
#detailPane{position:absolute;inset:0;z-index:5;background:var(--bg);transform:translateX(102%);transition:transform .25s ease;
  padding:0 .8rem 1.5rem}
.show-detail #detailPane{transform:none}
@media(min-width:900px){
  #main{grid-template-columns:minmax(21rem,28rem) 1fr;gap:1rem;padding:1rem}
  #listPane,#detailPane{position:static;transform:none;border-radius:20px;border:1px solid var(--line);border-top:3px solid var(--blue);
    background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 14px 40px rgba(0,0,0,.45);padding:0 1.1rem 2rem}
  .back{display:none!important}
}

/* ---------- list ---------- */
.lhead{position:sticky;top:0;z-index:6;margin:0 -.8rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .5rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.lhead{margin:0 -1.1rem;padding:.9rem 1.1rem .5rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.ltitle{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.ltitle h1{font-size:1.35rem;font-weight:750}
.cnt{color:var(--muted);font-size:.85rem}
.sp{flex:1}
.ib{width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;color:var(--text);
  display:grid;place-items:center;cursor:pointer}
.ib.add{background:linear-gradient(135deg,var(--acc),var(--acc-d));border:0;color:var(--acc-tx)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.qrow{display:flex;gap:.5rem;align-items:center}
.qrow input{margin:0;flex:1}
.qrow .ib{flex:none}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--grey)}
.dot.ok{background:var(--green)} .dot.sync{background:var(--orange);animation:pulse 1s infinite} .dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;padding:.55rem 0 .1rem}
.chip{flex:none;border:1px solid var(--line);background:#141821;color:var(--text);border-radius:999px;padding:.22rem .6rem;
  font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue-d);border-color:var(--blue)}
.chip.due{border-color:rgba(229,96,92,.6);color:var(--orange)}
.chip.due.on{background:rgba(229,96,92,.22)}
.chip.sm{font-size:.82rem;padding:.28rem .65rem}

.card{display:grid;grid-template-columns:1fr;gap:.7rem;align-items:center;margin:.6rem 0;padding:.8rem .9rem;border-radius:16px;
  background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-left:4px solid var(--blue);cursor:pointer}
.card.over{border-left-color:var(--orange)} .card.today{border-left-color:var(--teal)}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.c-top{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.c-firma{font-size:1rem}
.c-sub{color:var(--muted);font-size:.85rem;margin-top:.1rem}
.c-bot{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-top:.3rem;font-size:.85rem}
.c-next{color:var(--text);opacity:.85}
.when{font-weight:650}
.when.over{color:var(--orange)} .when.today{color:var(--teal)} .when.fut{color:#4db8ff} .when.none{color:var(--muted);font-weight:400}
.qcall{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc-d));
  color:var(--acc-tx);text-decoration:none;box-shadow:0 6px 16px rgba(95,179,236,.25)}
.badge{display:inline-block;border-radius:999px;padding:.12rem .65rem;font-size:.75rem;font-weight:600;color:var(--c);background:var(--cb);border:1px solid var(--c)}
.b-teal{--c:#1fd6c8;--cb:rgba(235,188,90,.12)} .b-orange{--c:#ff9f3d;--cb:rgba(229,96,92,.12)}
.b-red{--c:#ff6b6b;--cb:rgba(255,107,107,.12)} .b-green{--c:#3ddc84;--cb:rgba(61,220,132,.12)}
.b-blue{--c:#6aa5ff;--cb:rgba(59,130,246,.15)} .b-violet{--c:#a78bfa;--cb:rgba(167,139,250,.12)} .b-grey{--c:#9aa6b8;--cb:rgba(140,152,171,.12)}
.more{width:100%;margin:.6rem 0;padding:.8rem;border-radius:14px;border:1px dashed var(--line);background:none;cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);padding:1rem .2rem}
.empty.big{text-align:center;padding:4rem 1rem;font-size:1.1rem}

/* ---------- detail ---------- */
.dhead{position:sticky;top:0;z-index:6;display:flex;align-items:flex-start;gap:.7rem;margin:0 -.8rem .4rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .6rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.dhead{margin:0 -1.1rem .4rem;padding:.9rem 1.1rem .6rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.dhead h2{font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.dhead .sub{color:var(--text);font-size:1.1rem;font-weight:650;margin-top:.15rem}
.back{flex:none;width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;display:grid;place-items:center;cursor:pointer}
.calls{display:grid;gap:.8rem;grid-template-columns:1fr;margin:.3rem 0 .9rem}
@media(min-width:600px){.calls.two{grid-template-columns:3fr 2fr}}
.call{display:flex;align-items:center;justify-content:center;gap:.6rem;text-decoration:none;border-radius:18px;font-weight:750;min-height:3.4rem;padding:.4rem 1rem}
.call .ico{width:1.05em;height:1.05em}
.call.main{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-tx);font-size:1.5rem;box-shadow:0 10px 28px rgba(95,179,236,.3)}
.call.alt{background:#1a2538;border:1px solid #44556f;color:#d4dcea;font-size:1.15rem}
.callnote{color:var(--muted);font-size:.85rem;margin-top:.35rem;padding:0 .3rem}
.nextCall{display:flex;align-items:center;gap:.5rem;background:rgba(235,188,90,.14);border:1px solid rgba(235,188,90,.5);
  color:var(--teal);font-weight:700;border-radius:14px;padding:.55rem .8rem;margin:.3rem 0 .8rem}
.nextCall .ico{width:1.2em;height:1.2em;flex:none}
.links{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.lnk{display:inline-flex;align-items:center;gap:.4rem;color:#4db8ff;text-decoration:none;font-size:.88rem;border:1px solid var(--line);border-radius:12px;padding:.35rem .7rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:.9rem;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:.9rem;padding:.5rem .8rem;cursor:pointer;font-weight:600;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.win{background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-top:2px solid var(--blue);border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pad{padding:1rem}
label{display:block;color:var(--muted);font-size:.82rem;margin:.1rem 0 .8rem}
input,select,textarea{display:block;width:100%;margin-top:.3rem;background:var(--field);border:1px solid rgba(255,255,255,.12);border-radius:12px;
  color:var(--text);padding:.55rem .75rem;min-height:2.6rem;color-scheme:dark;min-width:0;font-size:max(16px,1rem)}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(235,188,90,.18)}
input[readonly]{opacity:.7}
.dt{display:grid;grid-template-columns:3fr 2fr;gap:.7rem}
.qd{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .8rem}
.qn{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .8rem}
.dtRow{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start;margin-bottom:.2rem}
.dtNarrow{display:flex;gap:.5rem;flex-wrap:wrap;max-width:18rem}
.dtNarrow label{flex:1 1 6.5rem;min-width:6.5rem;margin-bottom:0;display:flex;flex-direction:column}
.dtNarrow label select,.dtNarrow label input{flex:none}
.dtNarrow .qd{margin:.4rem 0 0;flex-wrap:wrap;gap:.3rem}
.dtNarrow .qd .chip.sm{padding:.22rem .5rem;font-size:.78rem}
.dtSmall{padding:.5rem .55rem;min-height:2.4rem}
.dtAct{min-width:0;max-width:11rem;margin-left:auto}
.dtRowSingle{grid-template-columns:1fr}
@media(max-width:480px){.dtRow{grid-template-columns:1fr}.dtAct{margin-left:0;max-width:none}.dtRow{row-gap:.6rem}}
.cta{width:100%;min-height:3rem;border:0;border-radius:14px;font-weight:750;font-size:1rem;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-tx);box-shadow:0 8px 22px rgba(95,179,236,.25)}
.cta:disabled{opacity:.6}
.cta.stick{position:sticky;bottom:.5rem;z-index:4;box-shadow:0 0 0 .5rem rgba(11,29,58,.85),0 8px 22px rgba(229,96,92,.3)}
.saveRow{display:flex;gap:.6rem;align-items:stretch}
.saveRow .cta.stick{flex:1}
.undoBtn{flex:none;width:auto;min-height:3rem;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:0 1rem;white-space:nowrap}
.undoBtn .ico{width:1.1em;height:1.1em}
.btn-sm{margin-left:auto;border:0;border-radius:10px;padding:.35rem .8rem;font-size:.82rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-tx)}
.btn-sm:disabled{opacity:.6}
.qn{align-items:center}
.dgrp{margin:.9rem .2rem .1rem;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dgrp.over{color:var(--orange)}
.dgrp.today{color:#2a1f05;background:var(--teal);display:inline-block;padding:.15rem .7rem;border-radius:999px;margin-left:0}
.card.today{background:linear-gradient(180deg,rgba(235,188,90,.22),rgba(235,188,90,.07));border-color:rgba(235,188,90,.65);border-left-color:var(--teal)}
.sts{display:flex;gap:.3rem;flex-wrap:wrap}
.cta.ghost{background:#141821;color:var(--text);box-shadow:none;border:1px solid var(--line)}
.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:.9rem 0 0;padding:.8rem .9rem;font:inherit;font-size:.88rem;color:#cdd7e6}
.gtitle{color:var(--teal);font-weight:700;margin:.4rem 0 .6rem;font-size:.95rem}
.saveOut{margin:.2rem 0 1rem;padding:.7rem .9rem;border-radius:12px;background:rgba(229,96,92,.1);border:1px solid rgba(229,96,92,.4);color:var(--orange)}
.hist{padding:.7rem .9rem;margin:.5rem 0;border-radius:14px;background:#141b34;border:1px solid var(--line)}
.hist .h-top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.hist .h-txt{font-size:.9rem}
.hist .h-txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:.25rem}
.ph{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;min-height:14rem}

/* ---------- modal / toast ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.72);display:grid;place-items:center;padding:1rem;backdrop-filter:blur(4px)}
.modal{width:min(40rem,100%);max-height:92dvh;overflow:auto;padding:1.1rem 1.2rem 1.3rem}
.mhead{display:flex;align-items:center;margin-bottom:.8rem}
.mhead h2{flex:1;font-size:1.2rem}
.maprow{display:grid;grid-template-columns:1fr 1.4fr;gap:.6rem;align-items:center;margin:.4rem 0}
.maprow span{color:var(--muted)}
.maprow select{margin:0}
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:#1a1810;border:1px solid var(--teal);color:var(--text);padding:.7rem 1.1rem;border-radius:14px;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1} #toast.err{background:#2a1412;border-color:var(--orange)}
@media(min-width:900px){#toast{bottom:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chip.on{background:#ebbc5a;border-color:#ebbc5a;color:#1a1405}
.c-firma{color:#4db8ff}
.nb.on{color:#ebbc5a}
.pick{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .2rem}
.pick button{border:2px solid transparent;border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.88rem;cursor:pointer;opacity:.45;font-family:inherit}
.pick button.on{opacity:1;border-color:#f0ece4}
.sts2{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.chips .chip,.chips select{padding:.5rem .4rem;font-size:.9rem;font-weight:700;text-align:center;border-radius:14px;min-height:0;margin:0;width:100%}
.chips select{appearance:none;-webkit-appearance:none;background:#141821;color:var(--text);border:1px solid var(--line);text-align-last:center}
.chips select.on{border-color:#6fd3b0;color:#6fd3b0}
.stsel,.actsel{appearance:auto;border:1px solid transparent;font-weight:700;color-scheme:dark}
.stsel{width:auto;margin:0;min-height:2rem;border-radius:999px;padding:.25rem .6rem;font-size:.85rem;background:#2a3358;color:#f0ece4}
.actsel{width:auto;max-width:100%;min-height:2.4rem;border-radius:999px;padding:.35rem .9rem;font-size:.95rem;font-weight:800;background:#2a3358;color:#f0ece4;border:2px solid currentColor}
.stsel option,.actsel option{background:#1b2440;color:#f0ece4}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.savemsg{color:var(--muted);font-size:.82rem;text-align:center;min-height:1.1rem;margin:.3rem 0}
.calmsg{color:var(--acc);font-size:.82rem;margin:.4rem 0 .2rem;font-weight:600}
.gofirma{color:#4db8ff;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:none}
.chips{position:relative}
.stpop{position:absolute;right:0;top:100%;margin-top:.3rem;min-width:13rem;z-index:30;background:#1b2544;border:1px solid var(--line);border-radius:14px;padding:.35rem;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.stitem{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border-radius:10px;cursor:pointer;font-size:.9rem}
.stitem:hover{background:rgba(255,255,255,.06)}
.ck{width:1.1rem;color:#6fd3b0;font-weight:800}
.chips .stbtn.sel{border-color:#6fd3b0;color:#6fd3b0}
.cg{border-radius:14px;padding:.4rem .8rem .2rem;margin:.7rem 0;border:1px solid var(--line)}
.cg.el{background:rgba(77,184,255,.10);border-color:rgba(77,184,255,.5)} .cg.el .gtitle{color:#4db8ff}
.cg.gas{background:rgba(235,188,90,.10);border-color:rgba(235,188,90,.5)} .cg.gas .gtitle{color:#ebbc5a}
.vtabs{display:flex;background:#141b34;border:1px solid var(--line);border-radius:12px;padding:.15rem;flex:none}
.vt{border:0;background:none;color:var(--muted);font-weight:700;padding:.35rem .8rem;border-radius:9px;cursor:pointer;font-size:.95rem;font-family:inherit}
.vt.on{background:#ebbc5a;color:#1a1405}
.ltitle{gap:.4rem}.sync{min-width:0;line-height:1.1}
@media(max-width:520px){.cnt{display:none}.ib{width:2.3rem;height:2.3rem}.vt{padding:.35rem .6rem}}
.qn .chip.sm,.qd .chip.sm{background:rgba(111,211,176,.14);border-color:rgba(111,211,176,.5);color:#8fe6c9}
.hl{background:rgba(77,184,255,.14);border:1px solid rgba(77,184,255,.35);border-radius:10px;padding:.3rem .6rem;margin-top:.45rem}
.hl .c-next{color:#9fd8ff}
.addcols{margin:.5rem 0 1rem;padding:.7rem .9rem;border-radius:12px;background:rgba(235,188,90,.1);border:1px solid rgba(235,188,90,.4);font-size:.88rem}

/* ===== úpravy v2 ===== */
.dtRow{grid-template-columns:minmax(0,1fr) auto}
.dtNarrow{max-width:none;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.dtNarrow label{flex:0 0 9rem;min-width:0}
.dtNarrow label.dtT{flex-basis:7rem}
.dtNarrow .qd{flex:1 1 auto;margin:0 0 .5rem;gap:.35rem;flex-wrap:wrap}
.dtNarrow label input,.dtNarrow label select{height:2.9rem;min-height:2.9rem;width:100%;margin-top:.3rem;padding:.4rem .75rem;font-size:1.05rem;border-radius:12px;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left}
.dtNarrow label select{background-image:linear-gradient(45deg,transparent 50%,#8b91a1 50%),linear-gradient(135deg,#8b91a1 50%,transparent 50%);background-position:calc(100% - 1.1rem) 50%,calc(100% - .8rem) 50%;background-size:.3rem .3rem,.3rem .3rem;background-repeat:no-repeat;padding-right:1.8rem}
.dtAct{width:9rem;max-width:9rem;min-width:0;justify-self:end;margin-left:auto}
.dtAct .actsel{width:100%}
.stsel,.actsel{min-height:2.9rem;padding:.4rem .9rem;font-size:1rem;font-weight:800;border-radius:999px;border:2px solid transparent;min-width:0;width:auto;margin-top:.3rem}
.stsel{margin-top:0}
.actsel{border-color:currentColor}
@media(max-width:480px){.dtRow{grid-template-columns:1fr}.dtAct{width:auto;max-width:none;justify-self:stretch}}
.callnote{font-size:.85rem;color:#cdd7e6;line-height:1.35}
.dhead h2,.c-firma,.firma{color:#4db8ff}
.dhead .sub,.meno{color:#fff;font-weight:700}
.chip.on{background:#4db8ff;border-color:#4db8ff;color:#06263d}
.anbox{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.btn-an{border:0;border-radius:12px;padding:.5rem 1rem;font-weight:750;font-size:.9rem;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-tx)}
.btn-an:disabled{opacity:.6}
.anok{display:inline-flex;align-items:center;gap:.3rem;font-weight:750;font-size:.88rem;color:#b9f5dc;background:rgba(111,211,176,.18);border:1px solid #6fd3b0;border-radius:12px;padding:.4rem .75rem;box-shadow:0 0 12px rgba(111,211,176,.45)}

/* ===== MOTÍV v5 – farby a okná podľa „Analýza cien“ (pôvodné písmo) ===== */
:root{
  color-scheme:dark;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --bg:#0a0e14; --panel:#151b24; --panel2:#1a212c; --card:#151b24; --raise:#1a212c; --field:#0f141b;
  --line:#252d3a; --text:#e6edf3; --muted:#8b949e; --meno:#fff;
  --blue:#4c9eff; --blue-d:#4c9eff; --acc:#4c9eff; --acc-d:#2f7fe0; --acc-tx:#fff; --teal:#4c9eff; --teal-d:#2f7fe0;
  --el-bg:rgba(76,158,255,.12); --el-bd:rgba(76,158,255,.32); --el-tx:#4c9eff;
  --gas-bg:rgba(245,208,74,.12); --gas-bd:rgba(245,208,74,.32); --gas-tx:#f5d04a;
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.12); --ok-bd:rgba(63,185,80,.35);

:root{--call-bg:linear-gradient(135deg,#2f8f4e 0%,#1c5a33 55%,#143d27 100%);--call-bd:#4cc774;--call-tx:#e9fff0;--call-sh:inset 0 1px 0 rgba(200,255,220,.25),0 5px 14px rgba(0,0,0,.45)}

.lhead{padding-top:calc(env(safe-area-inset-top) + .3rem);padding-bottom:.3rem}

.actTag{display:inline-flex;align-items:center;gap:.25rem;align-self:flex-start;margin-bottom:.35rem;padding:.12rem .65rem;border-radius:999px;font-size:.75rem;font-weight:600;line-height:1.3;box-sizing:border-box}

.saveTop,.undoTop{font-size:1rem}

.calOvl{position:fixed;inset:0;z-index:200;background:transparent}

const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return iso(d); };

/* ---------- API ---------- */
async function api(action, payload = {}) {
  if (!S.cfg.url) throw new Error('Chýba URL – otvor Nastavenia');
  const body = JSON.stringify({token: S.cfg.token, action, ...payload});
  const isRead = action === 'read' || action === 'ping';
  const tries = isRead ? 2 : 1;   // čítanie sa bezpečne opakuje, zápis nie (aby sa nezdvojil)
  let last;
  for (let i = 0; i < tries; i++) {
    if (i) await new Promise(r => setTimeout(r, 1200 * i));
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), isRead ? 90000 : 60000);
      let res; try { res = await fetch(S.cfg.url, {method: 'POST', redirect: 'follow', cache: 'no-store', body, signal: ctl.signal}); } catch (e) { throw new Error(e.name === 'AbortError' ? 'Server neodpovedal včas' : e.message); } finally { clearTimeout(to); }
      const txt = await res.text();
      let j; try { j = JSON.parse(txt); } catch (e) {
        last = new Error('Server nevrátil JSON (' + res.status + '): ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140));
        last.lost = true;
        continue;
      }
      if (!j.ok) { const e = new Error(j.error || 'Chyba servera'); e.conflict = j.conflict; throw e; }
      return j;
    } catch (e) {
      if (e.conflict !== undefined || tries === 1 || /^Chyba|Neplatn|Riadok|Záložka|Neznáma/.test(e.message)) { last = e; break; }
      last = e;
    }
  }
  if (!isRead && last && (last.lost || /neodpovedal/.test(last.message))) {
    setTimeout(() => { if (!loading) load(true); }, 1500);
    throw new Error('Odpoveď servera sa stratila – zmena sa pravdepodobne uložila, dáta si znova načítavam.');
  }
  throw last;
}

/* veľký kalendár namiesto malého natívneho */
function openCal(inp) {
  const MN = ['Január', 'Február', 'Marec', 'Apríl', 'Máj', 'Jún', 'Júl', 'August', 'September', 'Október', 'November', 'December'];
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const has = /^\d{4}-\d{2}-\d{2}$/.test(inp.value);
  const base = has ? new Date(inp.value + 'T00:00:00') : new Date();
  let vy = base.getFullYear(), vm = base.getMonth();
  const today = iso(new Date());
  document.getElementById('calPop')?.remove();
  const box = document.createElement('div'); box.id = 'calPop'; document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  const setV = v => { inp.value = v; inp.dispatchEvent(new Event('input', {bubbles: true})); inp.dispatchEvent(new Event('change', {bubbles: true})); close(); };
  let draw = () => {
    const first = new Date(vy, vm, 1), lead = (first.getDay() + 6) % 7, days = new Date(vy, vm + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const v = vy + '-' + pad(vm + 1) + '-' + pad(d);
      cells += `<button type="button" class="cd ${v === inp.value ? 'sel' : ''} ${v === today ? 'td' : ''}" data-v="${v}">${d}</button>`;
    }
    box.innerHTML = `<div class="calOvl" data-close><div class="calBox"><div class="calHd"><button type="button" data-nav="-1">‹</button><b>${MN[vm]} ${vy}</b><button type="button" data-nav="1">›</button></div>
      <div class="calWd"><span>Po</span><span>Ut</span><span>St</span><span>Št</span><span>Pi</span><span>So</span><span>Ne</span></div>
      <div class="calGr">${cells}</div>
      <div class="calFt"><button type="button" data-today>Dnes</button><button type="button" data-clear>Vymazať</button><button type="button" data-close>Zavrieť</button></div></div></div>`;
  };
  const place = () => {
    const cb = box.querySelector('.calBox'); if (!cb) return;
    if (!place.pos) {
      const r = inp.getBoundingClientRect(), bw = cb.offsetWidth, bh = cb.offsetHeight;
      let top = r.bottom + 6; if (top + bh > innerHeight - 8) top = Math.max(8, r.top - bh - 6);
      place.pos = {left: Math.min(Math.max(8, r.left), Math.max(8, innerWidth - bw - 8)), top};
    }
    cb.style.left = place.pos.left + 'px'; cb.style.top = place.pos.top + 'px';
  };
  const _draw = draw; draw = () => { _draw(); place(); };
  box.addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.nav) { vm += +t.dataset.nav; if (vm < 0) { vm = 11; vy--; } if (vm > 11) { vm = 0; vy++; } draw(); }
    else if (t.dataset.v) setV(t.dataset.v);
    else if ('today' in t.dataset) setV(today);
    else if ('clear' in t.dataset) setV('');
    else if ('close' in t.dataset) close();
  });
  draw();
}
document.addEventListener('click', e => {
  const i = e.target.closest && e.target.closest('input[type="date"]');
  if (i) { e.preventDefault(); i.blur(); openCal(i); }

  const d2 = findDupIco(ic, 0, ''); if (d2 && !confirm(`⚠️ IČO ${ic} už má firma „${V(d2, 'firma')}“.\nNaozaj pridať nový kontakt?`)) return;
  busy(form, true);
  try {
    const tmp = {v: Object.fromEntries(Object.entries(vals).map(([h, s]) => [h, specVal(s)]))};
    const act = actFor(tmp, 'Nový kontakt', '', vals);
    const j = await api('append', {sheet: 'contacts', values: vals, activity: act});
    const row = {r: j.row, v: tmp.v, n: {}};
    S.data.contacts.headers.forEach(h => { if (!(h in row.v)) row.v[h] = ''; });
    S.data.contacts.rows.push(row); pushActivity(act); persist(); closeModal();
    toast('Kontakt pridaný ✔'); S.view = 'contacts'; S.q = ''; S.chip = 'all'; openSel(row.r);
  } catch (e) { busy(form, false); toast(e.message, true); }
}

  if ((el = t.closest('[data-chip]'))) { S.chip = el.dataset.chip; S.stOpen = false; if (S.chip === 'all') { S.stSet.clear(); saveStFilter(); } S.limit = 150; renderChips(); renderListBody(); return; }
  if ((el = t.closest('[data-open]'))) { openSel(Number(el.dataset.open)); return; }
  if ((el = t.closest('[data-gotoact]'))) {
    const [f, o] = el.dataset.gotoact.split('|');
    const r = S.data.contacts.rows.find(r => norm(V(r, 'firma')) === norm(f) && (!o || norm(V(r, 'osoba')) === norm(o))) || S.data.contacts.rows.find(r => norm(V(r, 'firma')) === norm(f));
    if (r) { S.view = 'contacts'; S.q = ''; S.chip = 'all'; openSel(r.r); } else toast('Kontakt sa nenašiel', true);
    return;
  }
  if ((el = t.closest('[data-pv]'))) {
    const box = el.closest('[data-pick]'), inp = box.querySelector('input'), was = el.classList.contains('on');
    box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    inp.value = was ? '' : el.dataset.pv; if (!was) el.classList.add('on'); markDirty(); return;
  }
  if ((el = t.closest('[data-qn]'))) { const a = $('#callNote'); a.value = a.value ? a.value.replace(/[\s,]+$/, '') + ', ' + el.dataset.qn : el.dataset.qn; markDirty(); return; }
  if ((el = t.closest('[data-qnx]'))) {
    const f = el.closest('form'), inp = f.querySelector('[data-h="' + CSS.escape(S.m.dalsi || '') + '"]');
    if (inp) { inp.value = el.dataset.qnx; markDirty(); }
    return;
  }
  if ((el = t.closest('[data-qd],[data-qdm],[data-qt]'))) {
    const f = el.closest('form'), de = f.querySelector('[data-t="d"]'), te = f.querySelector('[data-t="t"]');
    if (el.dataset.qd !== undefined) de.value = el.dataset.qd === 'clear' ? '' : addDays(Number(el.dataset.qd));
    if (el.dataset.qdm !== undefined) de.value = addMonths(Number(el.dataset.qdm));
    if (el.dataset.qt !== undefined) { te.value = el.dataset.qt; if (!de.value) de.value = todayISO(); }
    if (el.dataset.qd === 'clear' && te) te.value = '';
    markDirty(); return;
  }
  if (t.classList.contains('ovl')) { closeModal(); return; }
  if ((el = t.closest('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'back') closeSel();
    else if (a === 'undo') undoLast();
    else if (a === 'refresh') load();
    else if (a === 'savenote') saveNote(el);
    else if (a === 'rcskip') { try { sessionStorage.setItem('crm.rcskip', S.mmSig || ''); } catch (e) {} closeModal(); }
    else if (a === 'rcapply') applyLists();
    else if (a === 'savetop') {
      const f = document.querySelector('#tabBody form');
      S.pressUntil = Date.now() + 1100;
      document.querySelectorAll('.saveTop').forEach(b => { b.classList.add('pressed'); b.textContent = 'Ukladám…'; });
      setTimeout(() => document.querySelectorAll('.saveTop').forEach(b => { b.classList.remove('pressed'); b.textContent = 'Uložiť'; }), 1100);
      if (f) f.requestSubmit();

    else if (a === 'clearhist') clearHist();
    else if (a === 'loadan') { const fi = $('#anFile'); if (fi) fi.click(); }
    else if (a === 'more') { S.limit += 150; renderListBody(); }

    else if (a === 'add') openNewContact();
    else if (a === 'addcols') {
      const names = FIELDS.filter(f => !S.m[f.k] && S.map[f.k] === undefined).map(f => f.label.replace(/ \(hlavný\)$/, ''));
      el.disabled = true;
      api('addcols', {headers: names}).then(j => { toast('Pridané do Sheetu: ' + ((j.added || []).join(', ') || 'nič'));  closeModal(); load(); })
        .catch(e => { el.disabled = false; toast(e.message, true); });

    else if (a === 'reloadcols') { el.disabled = true; load().then(() => { if ($('#fSet')) openSettings(); }); }
    else if (a === 'selectallcols') {
      S.map = {}; for (const f of FIELDS) if (S.auto[f.k]) S.map[f.k] = S.auto[f.k];
      LS.setItem('crm.map', JSON.stringify(S.map)); buildMap(); render(); openSettings();
    }
    else if (a === 'copycfg') {
      const link = location.origin + location.pathname + '#cfg=' + btoa(JSON.stringify(S.cfg));
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Odkaz skopírovaný – otvor ho na druhom zariadení'), () => prompt('Skopíruj odkaz:', link));

/* ---------- načítanie analýzy z xlsx ---------- */
function anBadge(r) {
  const col = isoDate(V(r, 'an_ok'));
  if (col) return `<span class="anok">✔ Analýza načítaná ${col.split('-').reverse().join('.')}</span>`;
  const f = norm(V(r, 'firma')); if (!f) return '';
  let best = '';
  for (const a of S.data.activities.rows) {
    if (norm(a.v[ACT_H.typ]) !== 'analyza nacitana' || norm(a.v[ACT_H.firma]) !== f) continue;
    const d = isoDate(a.v[ACT_H.dt]); if (d > best) best = d;
  }
  if (!best) return '';
  return `<span class="anok">✔ Analýza načítaná ${best.split('-').reverse().join('.')}</span>`;
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Nepodarilo sa načítať knižnicu pre xlsx (internet?)'));
    document.head.appendChild(sc);
  });
}
function parseAnalysis(wb) {
  const name = wb.SheetNames.find(n => /analyz/.test(norm(n))) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: ''});
  const txt = x => String(x ?? '').trim();
  const nn = x => typeof x === 'number' ? x : num(x);
  const xd = v => { if (typeof v === 'number' && v > 20000) { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; } return isoDate(v); };
  const heads = []; rows.forEach((r, i) => { if (norm(r[0]) === 'om') heads.push(i); });
  if (!heads.length) throw new Error('V súbore som nenašiel tabuľky odberných miest (hlavička „OM #“)');
  // odberateľ (riadky nad prvou tabuľkou: štítok v stĺpci A/B, hodnota vedľa)
  const cust = {}, lab = {odberatel: 'odb', ico: 'ico', ulica: 'ulica', psc: 'psc', mesto: 'mesto'};
  rows.slice(0, heads[0]).forEach(r => {
    for (let c = 0; c < 4; c++) {
      const k = lab[norm(r[c])];
      if (k && cust[k] === undefined) { const v = r.slice(c + 1).find(x => txt(x) !== ''); if (v !== undefined) cust[k] = txt(v); }
    }
  });
  const out = {cust, el: null, pl: null};
  heads.forEach((hi, n) => {
    let kind = null;
    for (let i = hi - 1; i >= Math.max(0, hi - 3) && !kind; i--) {
      const t = norm(rows[i][0]); if (t.includes('elektrin')) kind = 'el'; else if (t.includes('plyn')) kind = 'pl';
    }
    if (!kind) kind = n === 0 ? 'el' : 'pl';
    const hr = rows[hi].map(norm);
    const col = (pat, d) => { const i = hr.findIndex(h => h.includes(pat)); return i >= 0 ? i : d; };
    const cD = col('dodavatel', 2), cS = col('spotreba', 9), cC = col('cena', 11), cK = col('druh', 10), cV = col('do kedy', 8);
    const data = []; let sum = null;
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (norm(r[0]).startsWith('spolu')) { sum = r; break; }
      if (typeof r[0] !== 'number' && !/^\d+$/.test(txt(r[0]))) break;
      data.push(r);
    }
    if (!data.length) return;
    let sp = sum ? nn(sum[cS]) : NaN;
    if (!(sp > 0)) sp = data.reduce((a, r) => a + (nn(r[cS]) || 0), 0);
    let price = sum ? nn(sum[cC]) : NaN;
    if (!(price > 0)) {
      const ok = data.filter(r => nn(r[cS]) > 0 && nn(r[cC]) > 0), fix = ok.filter(r => /fix/.test(norm(r[cK])));
      const base = fix.length ? fix : ok, w = base.reduce((a, r) => a + nn(r[cS]), 0);
      price = w ? base.reduce((a, r) => a + nn(r[cS]) * nn(r[cC]), 0) / w : NaN;
    }
    const dod = [...new Set(data.map(r => txt(r[cD])).filter(Boolean))].join(', ');
    const kons = data.map(r => xd(r[cV])).filter(Boolean).sort();
    const kon = kons[0] || (data.some(r => /neurcit/.test(norm(r[cV]))) ? 'neurčitá' : '');
    const druh = [...new Set(data.map(r => { const t = norm(r[cK]); return t.includes('fix') ? 'Fix' : t.includes('spot') ? 'Spot' : t.includes('kombi') ? 'Kombi' : txt(r[cK]); }).filter(Boolean))].join('/');
    out[kind] = {dod, druh, sp, cs: price, kon, oms: data.length};
  });
  if (!out.el && !out.pl) throw new Error('V súbore som nenašiel údaje o odberných miestach');
  return out;
}
const r3 = x => Math.round(x * 1000) / 1000;
const fmtDec = x => String(r3(x)).replace('.', ',');
async function importAnalysis(file) {
  const r = rowBy(S.sel); if (!r) return;
  const btn = document.querySelector('.btn-an'); if (btn) btn.disabled = true;
  try {
    toast('Čítam analýzu…');
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const A = parseAnalysis(wb);
    const a = norm(A.cust.odb), b = norm(V(r, 'firma'));
    if (a && b && !a.includes(b) && !b.includes(a) && a.split(' ')[0] !== b.split(' ')[0] &&
        !confirm(`Analýza je pre „${A.cust.odb}“, ale otvorená firma je „${V(r, 'firma')}“.\nPokračovať a zapísať údaje?`)) return;
    const dup = findDupIco(A.cust.ico, r.r, norm(V(r, 'firma')));
    if (dup && !confirm(`⚠️ IČO ${A.cust.ico} z analýzy už má aj firma „${V(dup, 'firma')}“.\nPokračovať a zapísať údaje?`)) return;
    const vals = {};
    const put = (k, v, onlyEmpty) => {
      if (v === '' || v == null || (typeof v === 'number' && !isFinite(v))) return;
      if (onlyEmpty && String(V(r, k)).trim()) return;
      if (k === 'pl_druh' && !S.m.pl_druh) return;
      const h = fieldHeader(k); if (h) vals[h] = v;
    };
    put('obch', A.cust.odb); put('ico', A.cust.ico, true); put('ulica', A.cust.ulica, true); put('psc', A.cust.psc, true); put('mesto', A.cust.mesto, true);
    for (const g of ['el', 'pl']) {
      const x = A[g]; if (!x) continue;
      put(g + '_dod', x.dod); put(g + '_druh', x.druh); put(g + '_sp', isFinite(x.sp) ? r3(x.sp) : null); put(g + '_cs', isFinite(x.cs) ? r3(x.cs) : null);
      if (x.kon) put(g + '_kon', x.kon === 'neurčitá' ? 'neurčitá' : {t: 'd', v: x.kon});
    }
    put('an_ok', {t: 'd', v: todayISO()});
    const real = await materializeNewCols(vals);
    await api('update', {sheet: 'contacts', row: r.r, values: real, activity: actFor(r, 'Analýza načítaná', '', real),
      check: S.m.firma && !r.fd ? {header: S.m.firma, value: V(r, 'firma')} : null});
    setUndo(r, real);
    const local = {}; for (const h in real) local[h] = typeof real[h] === 'number' ? fmtDec(real[h]) : real[h];
    applyLocal(r, local); pushActivity(actFor(r, 'Analýza načítaná', '', real)); persist();
    S.dirty = false; S.tab = 'firma'; renderChips(); renderListBody(); renderDetail();
    const bits = []; if (A.el) bits.push(`elektrina ${fmtDec(A.el.sp)} MWh · ${fmtDec(A.el.cs)} €/MWh`); if (A.pl) bits.push(`plyn ${fmtDec(A.pl.sp)} MWh · ${fmtDec(A.pl.cs)} €/MWh`);
    toast('Analýza načítaná: ' + bits.join(' | '));
  } catch (e) { toast(e.message || String(e), true); if (e.conflict) load(true); }
  finally { const b2 = document.querySelector('.btn-an'); if (b2) b2.disabled = false; }
}
