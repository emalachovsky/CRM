<title>CRM</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("crmTheme")||"dark"}catch(e){}</script>
<style>
:root{
  --bg:#0b0e18; --panel:#1a2340; --panel2:#1f2a4b; --field:#111833;
  --line:rgba(130,160,255,.18); --blue:#4db8ff; --blue-d:#ebbc5a;
  --teal:#ebbc5a; --teal-d:#c99a35; --orange:#e5605c; --grey:#8b91a1;
  --acc:#8fd0ff; --acc-d:#5fb3ec; --acc-tx:#06263d;
  --text:#f0ece4; --muted:#8b91a1; --red:#e5605c; --green:#6fd3b0; --violet:#a78bfa;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.3vw + 13px,18px);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(235,188,90,.07),transparent),var(--bg);
  color:var(--text);font:1rem/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.ico{width:1.35em;height:1.35em;flex:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-rows:1fr;height:100dvh}
#main{position:relative;overflow:hidden;display:grid;min-height:0}
.pane{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
#listPane{padding:0 .8rem 1rem}
#listPane>.empty.big{padding-top:calc(env(safe-area-inset-top) + 4rem)}
#detailPane{position:absolute;inset:0;z-index:5;background:var(--bg);transform:translateX(102%);transition:transform .25s ease;
  padding:0 .8rem 1.5rem}
.show-detail #detailPane{transform:none}
@media(min-width:900px){
  #main{grid-template-columns:minmax(21rem,28rem) 1fr;gap:1rem;padding:1rem}
  #listPane,#detailPane{position:static;transform:none;border-radius:20px;border:1px solid var(--line);border-top:3px solid var(--blue);
    background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 14px 40px rgba(0,0,0,.45);padding:0 1.1rem 2rem}
  .back{display:none!important}
}

/* ---------- list ---------- */
.lhead{position:sticky;top:0;z-index:6;margin:0 -.8rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .5rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.lhead{margin:0 -1.1rem;padding:.9rem 1.1rem .5rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.ltitle{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.ltitle h1{font-size:1.35rem;font-weight:750}
.cnt{color:var(--muted);font-size:.85rem}
.sp{flex:1}
.ib{width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;color:var(--text);
  display:grid;place-items:center;cursor:pointer}
.ib.add{background:linear-gradient(135deg,var(--acc),var(--acc-d));border:0;color:var(--acc-tx)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.qrow{display:flex;gap:.5rem;align-items:center}
.qrow input{margin:0;flex:1}
.qrow .ib{flex:none}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--grey)}
.dot.ok{background:var(--green)} .dot.sync{background:var(--orange);animation:pulse 1s infinite} .dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;padding:.55rem 0 .1rem}
.chip{flex:none;border:1px solid var(--line);background:#141821;color:var(--text);border-radius:999px;padding:.22rem .6rem;
  font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue-d);border-color:var(--blue)}
.chip.due{border-color:rgba(229,96,92,.6);color:var(--orange)}
.chip.due.on{background:rgba(229,96,92,.22)}
.chip.sm{font-size:.82rem;padding:.28rem .65rem}

.card{display:grid;grid-template-columns:1fr;gap:.7rem;align-items:center;margin:.6rem 0;padding:.8rem .9rem;border-radius:16px;
  background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-left:4px solid var(--blue);cursor:pointer}
.card.over{border-left-color:var(--orange)} .card.today{border-left-color:var(--teal)}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.c-top{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.c-firma{font-size:1rem}
.c-sub{color:var(--muted);font-size:.85rem;margin-top:.1rem}
.c-bot{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-top:.3rem;font-size:.85rem}
.c-next{color:var(--text);opacity:.85}
.when{font-weight:650}
.when.over{color:var(--orange)} .when.today{color:var(--teal)} .when.fut{color:#4db8ff} .when.none{color:var(--muted);font-weight:400}
.qcall{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc-d));
  color:var(--acc-tx);text-decoration:none;box-shadow:0 6px 16px rgba(95,179,236,.25)}
.badge{display:inline-block;border-radius:999px;padding:.12rem .65rem;font-size:.75rem;font-weight:600;color:var(--c);background:var(--cb);border:1px solid var(--c)}
.b-teal{--c:#1fd6c8;--cb:rgba(235,188,90,.12)} .b-orange{--c:#ff9f3d;--cb:rgba(229,96,92,.12)}
.b-red{--c:#ff6b6b;--cb:rgba(255,107,107,.12)} .b-green{--c:#3ddc84;--cb:rgba(61,220,132,.12)}
.b-blue{--c:#6aa5ff;--cb:rgba(59,130,246,.15)} .b-violet{--c:#a78bfa;--cb:rgba(167,139,250,.12)} .b-grey{--c:#9aa6b8;--cb:rgba(140,152,171,.12)}
.more{width:100%;margin:.6rem 0;padding:.8rem;border-radius:14px;border:1px dashed var(--line);background:none;cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);padding:1rem .2rem}
.empty.big{text-align:center;padding:4rem 1rem;font-size:1.1rem}

/* ---------- detail ---------- */
.dhead{position:sticky;top:0;z-index:6;display:flex;align-items:flex-start;gap:.7rem;margin:0 -.8rem .4rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .6rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.dhead{margin:0 -1.1rem .4rem;padding:.9rem 1.1rem .6rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.dhead h2{font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.dhead .sub{color:var(--text);font-size:1.1rem;font-weight:650;margin-top:.15rem}
.back{flex:none;width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;display:grid;place-items:center;cursor:pointer}
.calls{display:grid;gap:.8rem;grid-template-columns:1fr;margin:.3rem 0 .9rem}
@media(min-width:600px){.calls.two{grid-template-columns:3fr 2fr}}
.call{display:flex;align-items:center;justify-content:center;gap:.6rem;text-decoration:none;border-radius:18px;font-weight:750;min-height:3.4rem;padding:.4rem 1rem}
.call .ico{width:1.05em;height:1.05em}
.call.main{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-tx);font-size:1.5rem;box-shadow:0 10px 28px rgba(95,179,236,.3)}
.call.alt{background:#1a2538;border:1px solid #44556f;color:#d4dcea;font-size:1.15rem}
.callnote{color:var(--muted);font-size:.85rem;margin-top:.35rem;padding:0 .3rem}
.nextCall{display:flex;align-items:center;gap:.5rem;background:rgba(235,188,90,.14);border:1px solid rgba(235,188,90,.5);
  color:var(--teal);font-weight:700;border-radius:14px;padding:.55rem .8rem;margin:.3rem 0 .8rem}
.nextCall .ico{width:1.2em;height:1.2em;flex:none}
.links{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.lnk{display:inline-flex;align-items:center;gap:.4rem;color:#4db8ff;text-decoration:none;font-size:.88rem;border:1px solid var(--line);border-radius:12px;padding:.35rem .7rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:.9rem;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:.9rem;padding:.5rem .8rem;cursor:pointer;font-weight:600;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.win{background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-top:2px solid var(--blue);border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pad{padding:1rem}
label{display:block;color:var(--muted);font-size:.82rem;margin:.1rem 0 .8rem}
input,select,textarea{display:block;width:100%;margin-top:.3rem;background:var(--field);border:1px solid rgba(255,255,255,.12);border-radius:12px;

/* ===== MOTÍV v5 – farby a okná podľa „Analýza cien“ (pôvodné písmo) ===== */
:root{
  color-scheme:dark;

}

  --line:#c3cbe0; --text:#1a1f18; --muted:#485046; --meno:#1a1f18;
  --blue:#1a5fb4; --blue-d:#1a5fb4; --acc:#1a5fb4; --acc-d:#154a8f; --acc-tx:#fff; --teal:#1a5fb4; --teal-d:#154a8f;
  --el-bg:#eaf3fc; --el-bd:#a8ccee; --el-tx:#1a5fb4;
  --gas-bg:#fdf6d8; --gas-bd:#e8d070; --gas-tx:#8a6c00;

:root{
  --btn-bg:linear-gradient(135deg,#4e4926 0%,#27261b 48%,#131923 100%); --btn-bd:rgba(236,212,85,.5); --btn-tx:#ecd455;
  --btn-on-bg:linear-gradient(135deg,#7b7230 0%,#403c1f 50%,#1a2030 100%); --btn-on-bd:#f3df6a; --btn-on-tx:#fff6c0;
  --btn-sh:inset 0 1px 0 rgba(255,236,130,.22),0 5px 14px rgba(0,0,0,.45);
  --nx-bg:#bfe0ff; --nx-bd:#8cc4f5; --nx-tx:#0b0f14; --nx-card:#8ec9ff;
  --urg-bg:#fff3b0; --urg-bd:#e6cf62; --urg-tx:#c0202a;
}
html[data-theme="light"]{
  --btn-bg:linear-gradient(135deg,#fff0a8,#fffbe3 55%,#f4f6fb); --btn-bd:#d9bf4f; --btn-tx:#7a5c00;
  --btn-on-bg:linear-gradient(135deg,#ffdf6b,#ffefa8 60%,#fff8dc); --btn-on-bd:#c9a72c; --btn-on-tx:#4d3a00;
  --btn-sh:inset 0 1px 0 #fff,0 4px 10px rgba(120,95,0,.18);
  --nx-bg:#cfe6ff; --nx-bd:#9cc7f0; --nx-card:#1a5fb4;
}
@media(min-width:900px){#main{grid-template-columns:minmax(24rem,31rem) 1fr}}
/* tlačidlá: telefón + filtre (tieňovanie podľa obrázka) */
.qcall,.call.main,.call.alt,.chip,.chips .chip,.chips select{background:var(--btn-bg);border:1px solid var(--btn-bd);color:var(--btn-tx);box-shadow:var(--btn-sh)}
.chips .chip.on,.chip.on,.chips .chip.due.on,.chip.due.on{background:var(--btn-on-bg);border-color:var(--btn-on-bd);color:var(--btn-on-tx)}
.chip.due,.chips .chip.due{border-color:var(--btn-bd);color:var(--btn-tx)}
.chips .stbtn.sel,.chips select.on{background:var(--btn-on-bg);border-color:var(--btn-on-bd);color:var(--btn-on-tx)}
.call.main{font-size:1.2rem} .call.alt{font-size:1.1rem}
/* Nasleduje */
.nextRow{display:flex;gap:.5rem;align-items:stretch;margin:.4rem 0}
.nextCall{flex:1;margin:0;background:var(--nx-bg);border-color:var(--nx-bd);color:var(--nx-tx);font-weight:600}
.nextCall.urg{background:var(--urg-bg);border-color:var(--urg-bd);color:var(--urg-tx)}
.urgBtn{display:flex;align-items:center;gap:.35rem;border:1.5px solid var(--ibd);background:var(--card);color:var(--muted);border-radius:12px;padding:0 .8rem;font-weight:700;cursor:pointer;font-size:.85rem}
.urgBtn .ico{width:1.15em;height:1.15em}
.urgBtn.on{background:var(--urg-tx);border-color:var(--urg-tx);color:#fff}
/* karta kontaktu: čas/dátum vľavo, firma/meno/nasleduje vedľa */
.card{grid-template-columns:auto minmax(0,1fr);gap:.9rem;align-items:center}
.c-left{text-align:center;min-width:4.2rem;padding-right:.9rem;border-right:1px solid var(--line)}
.c-time{font-size:1.55rem;font-weight:700;line-height:1.05;color:var(--meno);font-variant-numeric:tabular-nums}
.c-date{font-size:.78rem;color:var(--meno);opacity:.85;margin-top:.25rem}
.c-left.over .c-time,.c-left.over .c-date{color:var(--red);opacity:1}
.c-next{display:block;margin-top:.3rem;font-size:.85rem;font-weight:600;color:var(--nx-card);opacity:1}
.c-next.urg{display:inline-block;background:var(--urg-bg);color:var(--urg-tx);border-radius:8px;padding:.05rem .5rem}
/* názvy okien veľkými písmenami */
.gtitle,.mhead h2,.dgrp{text-transform:uppercase;letter-spacing:.08em}
.mhead h2{font-size:1.1rem}
/* ===== v8 ===== */
:root{--nx-bg:#a4bdd6;--nx-bd:#8aa6c2;--nx-tx:#0b0f14;--urg-bg:#e3d58e;--urg-bd:#c8b75f;
  --f-bg:#141821;--f-bd:#222a38;--f-tx:#8b91a1;--f-on-bg:#ebbc5a;--f-on-tx:#1a1405;--f-sel:#6fd3b0}
html[data-theme="light"]{--nx-bg:#d3e0ee;--nx-bd:#a9bfd6;--urg-bg:#f1e7ae;--urg-bd:#d6c875;
  --f-bg:#ffffff;--f-bd:#c3cbe0;--f-tx:#66738a;--f-on-bg:#ebbc5a;--f-on-tx:#2d2200;--f-sel:#1e7a3c}
/* filtre podľa obrázka */
.chips .chip,.chips .chip.due,.chips select{background:var(--f-bg);border:1px solid var(--f-bd);color:var(--f-tx);box-shadow:none;font-weight:700}
.chips .chip.on,.chips .chip.due.on{background:var(--f-on-bg);border-color:var(--f-on-bg);color:var(--f-on-tx)}
.chips .stbtn.sel,.chips select.on{background:var(--f-bg);border:1px solid var(--f-sel);color:var(--f-sel)}
/* čiara hore v hlavných oknách */
.lhead,.dhead{background:linear-gradient(90deg,var(--blue),var(--ok) 50%,var(--gas-tx)) top/100% 3px no-repeat var(--panel)}
/* názvy kolóniek veľkými písmenami */
label{text-transform:uppercase;letter-spacing:.05em;font-size:.8rem}
label input,label select,label textarea{text-transform:none;letter-spacing:normal;font-size:1rem}
/* záložky */
.tabsRow{display:flex;align-items:flex-end;gap:.6rem;border-bottom:1.5px solid var(--ibd);margin-bottom:.9rem}
.tabs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:.25rem;border-bottom:0;margin-bottom:0;overflow:visible}
.tab{border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--field);color:var(--muted);padding:.5rem 1rem;margin-bottom:-1.5px;font-weight:600;border-top:3px solid transparent}
.tab.on{background:var(--panel);color:var(--text);border-color:var(--ibd);border-top-color:var(--firma);border-bottom:1.5px solid var(--panel);font-weight:700}
.tabsRow .anbox{margin:0 0 .4rem auto;gap:.5rem}
.btn-an{font-size:.76rem;padding:.3rem .75rem;border-radius:10px;background:var(--btn-bg);border:1px solid var(--btn-bd);color:var(--btn-tx);box-shadow:var(--btn-sh)}
@media(max-width:600px){.tab{padding:.45rem .6rem;font-size:.82rem}.tabsRow{flex-wrap:wrap}.tabsRow .anbox{margin:0 0 .4rem auto}}
/* urgent prepínač */
.urgSw{display:flex;align-items:center;gap:.45rem;background:none;border:0;cursor:pointer;padding:0 .25rem;flex:none}
.urgSw .trk{position:relative;width:2.7rem;height:1.55rem;border-radius:999px;border:2px solid #4b5563;background:#1a212c;transition:.18s}
.urgSw .knob{position:absolute;top:50%;left:.18rem;width:1.05rem;height:1.05rem;border-radius:50%;background:#8b949e;transform:translateY(-50%);transition:left .18s,background .18s}
.urgSw.on .trk{border-color:#3fb950;background:#1d4a27}
.urgSw.on .knob{left:calc(100% - 1.23rem);background:#4cd964}
.urgSw .bang{font-weight:800;font-size:1.35rem;line-height:1;color:var(--muted)}
.urgSw.on .bang{color:var(--urg-tx)}
html[data-theme="light"] .urgSw .trk{background:#e3e7f0;border-color:#aab3c8}
html[data-theme="light"] .urgSw.on .trk{background:#cfeedd;border-color:#1e7a3c}
/* ===== v9 ===== */
:root{--lr:#ff8f8f;--lr-bg:rgba(255,120,120,.16)}
html[data-theme="light"]{--lr:#e04a4a;--lr-bg:rgba(224,74,74,.12)}
/* Nasleduje v karte = rovnaké okienko ako v detaile */
.c-next{display:inline-flex;align-items:center;gap:.35rem;margin-top:.35rem;padding:.2rem .65rem;border-radius:10px;border:1px solid var(--nx-bd);background:var(--nx-bg);color:var(--nx-tx);font-size:.85rem;max-width:100%}
.c-next .ico{width:1em;height:1em;flex:none}
.c-next span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-next.urg{background:var(--urg-bg);border-color:var(--urg-bd);color:var(--urg-tx)}
/* Urgent prepínač – svetločervený + ikona trojuholník */
.urgSw{color:var(--lr)}
.urgSw .ico{width:1.5rem;height:1.5rem;color:var(--lr)}
.urgSw .trk{border-color:var(--lr);background:transparent;opacity:.75}
.urgSw .knob{background:var(--lr);opacity:.55}
.urgSw.on .trk{border-color:var(--lr);background:var(--lr-bg);opacity:1}
.urgSw.on .knob{background:var(--lr);opacity:1}
html[data-theme="light"] .urgSw .trk,html[data-theme="light"] .urgSw.on .trk{border-color:var(--lr)}
html[data-theme="light"] .urgSw.on .trk{background:var(--lr-bg)}
/* Druh – rovnaká výška ako ostatné kolónky vo Firme */
label input,label select,label textarea{font-size:max(16px,1rem)}
.cg label input,.cg label select{height:2.75rem;min-height:2.75rem}
.cg label select{-webkit-appearance:none;appearance:none;padding-right:2rem;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.1rem) 50%,calc(100% - .8rem) 50%;background-size:.3rem .3rem,.3rem .3rem;background-repeat:no-repeat}
/* kontakt – bez tučného písma */
.card,.card *,.dhead h2,.dhead .sub{font-weight:400}
/* ===== v10 ===== */
/* Urgent prepínač – sivý */
.urgSw,.urgSw .ico{color:var(--muted)}
.urgSw .trk{border-color:var(--muted);background:transparent;opacity:.85}
.urgSw .knob{background:var(--muted);opacity:.8}
.urgSw.on,.urgSw.on .ico{color:var(--text)}
.urgSw.on .trk{border-color:var(--text);background:rgba(139,148,158,.28);opacity:1}
.urgSw.on .knob{background:var(--text);opacity:1}
html[data-theme="light"] .urgSw .trk{border-color:var(--muted);background:transparent}
html[data-theme="light"] .urgSw.on .trk{border-color:var(--text);background:rgba(72,80,70,.16)}
/* tlačidlo Stav s obrysom */
.chips .stbtn{border:1.5px solid var(--muted)}
/* názov firmy hore – väčší, veľké písmená */
.dhead h2{font-size:1.75rem;line-height:1.15;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:520px){.dhead h2{font-size:1.35rem}}
.miss{margin:.4rem 0 1rem;padding:.7rem .9rem;border-radius:12px;background:var(--gas-bg);border:1px solid var(--gas-bd);font-size:.88rem}
.miss ul{margin:.3rem 0 .6rem;padding-left:1.1rem}
.miss.okm{background:var(--ok-bg);border-color:var(--ok-bd)}
/* ===== v11 ===== */
/* Nasleduje – jemné svetlé pozadie, tmavšia červená pre urgent */
:root{--nx-bg:#dfe9f4;--nx-bd:#c6d6e8;--nx-tx:#0b0f14;--urg-bg:#f4edcb;--urg-bd:#e0d49a;--urg-tx:#8f1620;
  --ur-on:#c4303a;--ur-on-bg:rgba(160,24,36,.55);--ur-on-bd:#e5535c}
html[data-theme="light"]{--nx-bg:#e9f0f8;--nx-bd:#cfdcec;--urg-bg:#f8f2d6;--urg-bd:#e6dba8;--urg-tx:#8f1620;
  --ur-on:#8f1620;--ur-on-bg:rgba(143,22,32,.16);--ur-on-bd:#8f1620}
/* Urgent prepínač zapnutý – tmavočervený, čitateľný na tmavom podklade */
.urgSw.on,.urgSw.on .ico{color:var(--ur-on-bd)}
.urgSw.on .trk{border-color:var(--ur-on-bd);background:var(--ur-on-bg);opacity:1}
.urgSw.on .knob{background:var(--ur-on-bd);opacity:1}
html[data-theme="light"] .urgSw.on,html[data-theme="light"] .urgSw.on .ico{color:var(--ur-on)}
html[data-theme="light"] .urgSw.on .trk{border-color:var(--ur-on-bd);background:var(--ur-on-bg)}
html[data-theme="light"] .urgSw.on .knob{background:var(--ur-on)}
.ph2>div{min-width:0}
/* ===== v12 ===== */
/* Nasleduje – úplne jemné pozadie */
:root{--nx-bg:#eef3f9;--nx-bd:#dfe8f2;--urg-bg:#faf5dd;--urg-bd:#eadfaa;--dt-yel:#f6e9a6}
html[data-theme="light"]{--nx-bg:#f4f8fc;--nx-bd:#e1eaf3;--urg-bg:#fcf8e4;--urg-bd:#ece2b4;--dt-yel:#8a6c00}
/* dátum a čas – svetložltý obsah */
.dtSmall,input[type=date].dtSmall,select.dtSmall,.dtNarrow label input,.dtNarrow label select{color:var(--dt-yel)}
/* náhľad poznámky pod „Nasleduje“ */
.notePrev{margin:.2rem 0 .8rem;padding:.55rem .75rem;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.npl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.2rem}
.npt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;max-height:7.5rem;overflow-y:auto;color:var(--text);opacity:.9}
.notesLb textarea{min-height:9rem}
/* neuložené zmeny – červené pulzujúce tlačidlo Uložiť */
body.dirty .cta.stick{background:linear-gradient(135deg,#e5484d,#a1141c);color:#fff;box-shadow:0 0 0 .5rem var(--panel),0 6px 18px rgba(229,72,77,.5);animation:dirtyGlow 1.6s ease-in-out infinite}
body.dirty .cta.stick::before{content:"● "}
@keyframes dirtyGlow{50%{filter:brightness(1.22)}}
/* ===== v13 ===== */
/* Nasleduje – tmavšie pozadie, čierne písmo čitateľné */
:root{--nx-bg:#b4c4d6;--nx-bd:#9bafc5;--urg-bg:#e6dba3;--urg-bd:#cfc183;--tel-g:#b6f0c6}
html[data-theme="light"]{--nx-bg:#d6e1ed;--nx-bd:#b7c8db;--urg-bg:#f0e7b8;--urg-bd:#d9cc8e;--tel-g:#1e7a3c}
/* poznámky pod číslom a pod Nasleduje – sivé */
.callnote,.callnote.nxnote{color:var(--muted);opacity:1}
.nxnote{margin:-.1rem 0 .8rem;padding:0 .3rem}
/* telefóny v editovacom okne – svetlozelené */
input[type=tel]{color:var(--tel-g)}
/* ===== v14 ===== */
/* poznámka pod Nasleduje (hore) – svetložltá */
.callnote.nxnote{color:var(--dt-yel)}
/* polia „Poznámka k …“ v editovacom okne – sivé */
input[data-note]{color:var(--muted)}
/* tlačidlá Telefón – zelené tieňovanie */
:root{--call-bg:linear-gradient(135deg,#2f8f4e 0%,#1c5a33 55%,#143d27 100%);--call-bd:#4cc774;--call-tx:#e9fff0;--call-sh:inset 0 1px 0 rgba(200,255,220,.25),0 5px 14px rgba(0,0,0,.45)}
html[data-theme="light"]{--call-bg:linear-gradient(135deg,#bfeccd 0%,#e3f7ea 60%,#f2fbf5 100%);--call-bd:#6fbf8a;--call-tx:#145a2e;--call-sh:inset 0 1px 0 #fff,0 4px 10px rgba(30,120,60,.18)}
.qcall,.call.main,.call.alt{background:var(--call-bg);border:1px solid var(--call-bd);color:var(--call-tx);box-shadow:var(--call-sh)}
/* ===== v12 ===== */
/* budúce termíny – jemne tmavomodré podfarbenie */
.card.fut{background:color-mix(in srgb,#2563eb 13%,var(--panel));border-left-color:color-mix(in srgb,#3b82f6 55%,var(--line))}
.card.fut:hover{background:color-mix(in srgb,#2563eb 19%,var(--raise))}
html[data-theme="light"] .card.fut{background:color-mix(in srgb,#2563eb 6%,var(--panel))}
/* po termíne – červený je len dátum a čas, karta zostáva bežná */
.card.over{background:color-mix(in srgb,#b91c1c 20%,var(--panel));border-left-color:#b91c1c}
.card.over:hover{background:color-mix(in srgb,#b91c1c 27%,var(--raise))}
.card.over,.card.over.sel{border-color:color-mix(in srgb,#b91c1c 55%,var(--line))}
.card.over.sel{border-color:#b91c1c;box-shadow:0 0 0 1px #b91c1c}
html[data-theme="light"] .card.over{background:color-mix(in srgb,#dc2626 11%,var(--panel))}
.card.over .c-left .c-time,.card.over .c-left .c-date,.c-left.over .c-time,.c-left.over .c-date{color:var(--red);opacity:1}
/* aktivita Stretnutie / Telefonát – tmavé zlaté podfarbenie */
.card.act,.card.act:hover{background:color-mix(in srgb,#8a6a00 42%,var(--panel));border-left-color:#f5c518}
html[data-theme="light"] .card.act,html[data-theme="light"] .card.act:hover{background:color-mix(in srgb,#e0b000 40%,var(--panel))}
.calsaved{display:block;margin:.25rem 0 0;font-size:.72rem;line-height:1.2;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hlavička zoznamu (hľadanie + filtre) – nižšia */
.lhead{padding-top:calc(env(safe-area-inset-top) + .3rem);padding-bottom:.3rem}
@media(min-width:900px){.lhead{padding-top:.5rem;padding-bottom:.3rem}}
.ltitle{margin-bottom:.3rem;gap:.5rem}
.ltitle h1{font-size:1.1rem}
.lhead .ib{width:2rem;height:2rem;border-radius:11px}
.lhead .ib svg,.lhead .ib .ico{width:1.05rem;height:1.05rem}
.qrow{gap:.4rem}
.qrow input{height:2.1rem;min-height:0;padding:.15rem .7rem;font-size:.9rem}
.chips{padding:.3rem 0 .05rem;gap:.3rem}
.chips .chip,.chips select{padding:.28rem .3rem;font-size:.82rem}
/* karty bez ľavej linky; linka len na vybranom kontakte, vo farbe jeho podfarbenia */
.c-top{align-items:flex-start}
.c-firma{min-width:0}
.c-stcol{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;flex:none}
.c-stcol .badge{white-space:nowrap}
html .card:not(.sel){border-left:1px solid var(--line)!important}
html .card.over:not(.sel){border-left-color:color-mix(in srgb,#b91c1c 55%,var(--line))!important}
html .card.today:not(.sel){border-left-color:var(--ok-bd)!important}
/* vybraný kontakt – sivý rámik ako polia na editáciu + ľavá linka vo farbe podfarbenia */
html .card.sel{border:1.5px solid var(--ibd)!important;border-left:4px solid var(--ibd)!important;padding-left:calc(.9rem - 3px);box-shadow:none!important}
html .card.sel.fut{border-left-color:#3b82f6!important}
html .card.sel.today{border-left-color:var(--ok)!important}
html .card.sel.over{border-left-color:#b91c1c!important}
html .card.sel.act{border-left-color:#f5c518!important}
/* štítky Stav + oznam v kartách rovnako široké */
.c-stcol .badge{min-width:var(--stw,0);box-sizing:border-box;text-align:center}
/* „Nasleduje“ v karte – tmavosivé pozadie, svetlosivé písmo */
html .card .c-next:not(.urg){background:#3a4150;border-color:#4a5263;color:#d5dae3}
/* oznam Telefonát / Stretnutie / Email v karte – vľavo v riadku so Stav, rovnaká veľkosť ako Stav */
.c-left{min-width:calc(var(--stw,6rem) + 1.1rem)}
.c-left.hasl{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.c-left.hasl .c-time,.c-left.hasl .c-date{align-self:center;width:var(--stw,auto);text-align:center}
.c-left .badge.actnote{display:flex;align-items:center;justify-content:center;gap:.25rem;width:var(--stw,auto);box-sizing:border-box;margin:0 0 .3rem;padding:.12rem .65rem;font-size:.75rem;font-weight:600;box-shadow:none;white-space:nowrap}
.c-left .badge.actnote .ico{width:.95em;height:.95em;flex:none}
/* štítok nad časom v okne kontaktu – rovnaký štýl */
.actTag{display:inline-flex;align-items:center;gap:.25rem;align-self:flex-start;margin-bottom:.35rem;padding:.12rem .65rem;border-radius:999px;font-size:.75rem;font-weight:600;line-height:1.3;box-sizing:border-box}
.actTag .ico{width:.95em;height:.95em;flex:none}
/* záložka Firma – základné údaje v 2 stĺpcoch, Elektrina a Plyn vedľa seba */
.cg.basic{display:grid;grid-template-columns:1fr 1fr;column-gap:.8rem}
.cg.basic .gtitle{grid-column:1/-1}
.cg.basic label{min-width:0}
.cgpair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-items:start}
.cgpair .cg{margin:.7rem 0;min-width:0}
.cgpair .cg label{min-width:0}
@media(max-width:380px){.cg.basic,.cgpair{grid-template-columns:1fr}}
/* tlačidlá telefónu – obe rovnako široké (podľa dlhšieho čísla s ikonkou), doľava, obe zelené */
.calls,.calls.two{display:grid;width:max-content;max-width:100%;grid-template-columns:max-content;grid-auto-flow:row;justify-content:start;gap:.5rem;margin:.3rem 0 .8rem}
@media(min-width:600px){.calls,.calls.two{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:1fr;gap:.6rem}}
.calls>div{min-width:0}
.calls .callnote{width:0;min-width:100%}
html .call,html .call.main,html .call.alt{min-height:2.5rem;padding:.2rem 1rem;border-radius:14px;font-size:1.1rem;justify-content:center;white-space:nowrap}
/* Nasleduje nad číslom – nižšie okienko */
/* Telefón 2 – sivé písmo */
html .call.alt{color:#aeb6c2}
html[data-theme="light"] .call.alt{color:#5b6472}
/* Uložiť pod Stav – rovnaký tvar a veľkosť ako Stav, Späť naľavo od neho */
.stCol{display:grid;grid-template-columns:auto max-content;justify-items:stretch;align-items:stretch;gap:.4rem;flex:none}
.stCol .stsel{grid-column:2;grid-row:1;min-width:calc(var(--stw,6rem) + 2.2rem)}
.stCol .saveGrp{display:contents}

function buildMap() {
  if (!S.data) return;
  const hs = S.data.contacts.headers, nh = hs.map(norm), used = new Set(), auto = {};

    let i = -1;
    for (const p of f.pats) { i = nh.findIndex((h, x) => !used.has(x) && h === p); if (i >= 0) break; }

function fmtPhone(raw) {
  raw = String(raw || ''); const m = raw.match(/\+?\d[\d\s\/().-]{5,}\d/); if (!m) return raw.trim();
  let d = m[0].replace(/\D/g, '');
  if (d.startsWith('00421')) d = '0' + d.slice(5); else if (m[0].trim().startsWith('+421')) d = '0' + d.slice(3); else if (d.startsWith('421') && d.length === 12) d = '0' + d.slice(3);

/* ---------- API ---------- */
async function api(action, payload = {}) {
  if (!S.cfg.url) throw new Error('Chýba URL – otvor Nastavenia');
  const body = JSON.stringify({token: S.cfg.token, action, ...payload});
  const isRead = action === 'read' || action === 'ping';
  const tries = isRead ? 2 : 1;   // čítanie sa bezpečne opakuje, zápis nie (aby sa nezdvojil)
  let last;
  for (let i = 0; i < tries; i++) {
    if (i) await new Promise(r => setTimeout(r, 1200 * i));
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), isRead ? 90000 : 60000);
      let res; try { res = await fetch(S.cfg.url, {method: 'POST', redirect: 'follow', cache: 'no-store', body, signal: ctl.signal}); } catch (e) { throw new Error(e.name === 'AbortError' ? 'Server neodpovedal včas' : e.message); } finally { clearTimeout(to); }
      const txt = await res.text();
      let j; try { j = JSON.parse(txt); } catch (e) {
        last = new Error('Server nevrátil JSON (' + res.status + '): ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140));
        last.lost = true;
        continue;
      }
      if (!j.ok) { const e = new Error(j.error || 'Chyba servera'); e.conflict = j.conflict; throw e; }
      return j;
    } catch (e) {
      if (e.conflict !== undefined || tries === 1 || /^Chyba|Neplatn|Riadok|Záložka|Neznáma/.test(e.message)) { last = e; break; }
      last = e;
    }
  }
  if (!isRead && last && (last.lost || /neodpovedal/.test(last.message))) {
    setTimeout(() => { if (!loading) load(true); }, 1500);
    throw new Error('Odpoveď servera sa stratila – zmena sa pravdepodobne uložila, dáta si znova načítavam.');
  }
  throw last;
}

}
function setSync(st, msg) { S.sy = {st, msg}; paintSync(); }
function paintSync() {
  const el = $('#sync'); if (!el) return; const sy = S.sy || {st: 'ok'};
  const tm = S.lastLoad ? new Date(S.lastLoad).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'}) : '';
  const t = sy.st === 'ok' ? (tm ? 'Načítané ' + tm : 'Z pamäte') : sy.st === 'sync' ? 'Načítavam…' : (sy.msg || 'Chyba');
  el.innerHTML = `<span class="dot ${sy.st}"></span>${esc(t)}`;
}
async function load(silent) {
  if (loading) return;
  loading = true; setSync('sync');
  try {
    const j = await api('read');
    S.data = j; S.lastLoad = Date.now(); buildMap(); persist();
    if (S.sel != null && S.view === 'contacts' && !rowBy(S.sel)) S.sel = null;
    render(); setSync('ok'); checkLists();
  } catch (e) { setSync('err', 'Chyba: ' + e.message); if (!silent) toast(e.message, true); }
  finally { loading = false; }
}

async function toggleUrgent() {

    applyLocal(r, vals); persist(); renderListBody(); renderDetail();

/* okno s poznámkami – výška sa prispôsobí tak, aby bolo vidno posledných 5 záznamov (najnovšie sú hore) */
function fitNotes() {
  const ta = document.getElementById('notesTa');
  if (!ta || !ta.offsetWidth) return;
  const lines = ta.value.split('\n');
  let cnt = 0, end = lines.length;
  for (let i = 0; i < lines.length; i++) {
    if (/^[─\-_=]{8,}\s*$/.test(lines[i]) && ++cnt === 5) { end = i + 1; break; }
  }
  const c = ta.cloneNode(false);
  c.removeAttribute('id'); c.removeAttribute('data-h'); c.removeAttribute('rows');
  c.value = lines.slice(0, end).join('\n');
  c.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;height:0;min-height:0;width:' + ta.offsetWidth + 'px';
  ta.parentNode.appendChild(c);
  const h = c.scrollHeight; c.remove();
  ta.style.height = (h + (ta.offsetHeight - ta.clientHeight) + 6) + 'px';
}
(function () {
  let raf = 0; const run = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fitNotes); };
  const pane = document.getElementById('detailPane');
  if (pane) new MutationObserver(run).observe(pane, {childList: true, subtree: true});
  addEventListener('resize', run);
  document.addEventListener('input', e => { if (e.target && e.target.id === 'notesTa') run(); });
})();
/* veľký kalendár namiesto malého natívneho */
function openCal(inp) {
  const MN = ['Január', 'Február', 'Marec', 'Apríl', 'Máj', 'Jún', 'Júl', 'August', 'September', 'Október', 'November', 'December'];
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const has = /^\d{4}-\d{2}-\d{2}$/.test(inp.value);
  const base = has ? new Date(inp.value + 'T00:00:00') : new Date();
  let vy = base.getFullYear(), vm = base.getMonth();
  const today = iso(new Date());
  document.getElementById('calPop')?.remove();
  const box = document.createElement('div'); box.id = 'calPop'; document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  const setV = v => { inp.value = v; inp.dispatchEvent(new Event('input', {bubbles: true})); inp.dispatchEvent(new Event('change', {bubbles: true})); close(); };
  let draw = () => {
    const first = new Date(vy, vm, 1), lead = (first.getDay() + 6) % 7, days = new Date(vy, vm + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const v = vy + '-' + pad(vm + 1) + '-' + pad(d);
      cells += `<button type="button" class="cd ${v === inp.value ? 'sel' : ''} ${v === today ? 'td' : ''}" data-v="${v}">${d}</button>`;
    }
    box.innerHTML = `<div class="calOvl" data-close><div class="calBox"><div class="calHd"><button type="button" data-nav="-1">‹</button><b>${MN[vm]} ${vy}</b><button type="button" data-nav="1">›</button></div>
      <div class="calWd"><span>Po</span><span>Ut</span><span>St</span><span>Št</span><span>Pi</span><span>So</span><span>Ne</span></div>
      <div class="calGr">${cells}</div>
      <div class="calFt"><button type="button" data-today>Dnes</button><button type="button" data-clear>Vymazať</button><button type="button" data-close>Zavrieť</button></div></div></div>`;
  };
  const place = () => {
    const cb = box.querySelector('.calBox'); if (!cb) return;
    if (!place.pos) {
      const r = inp.getBoundingClientRect(), bw = cb.offsetWidth, bh = cb.offsetHeight;
      let top = r.bottom + 6; if (top + bh > innerHeight - 8) top = Math.max(8, r.top - bh - 6);
      place.pos = {left: Math.min(Math.max(8, r.left), Math.max(8, innerWidth - bw - 8)), top};
    }
    cb.style.left = place.pos.left + 'px'; cb.style.top = place.pos.top + 'px';
  };
  const _draw = draw; draw = () => { _draw(); place(); };
  box.addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.nav) { vm += +t.dataset.nav; if (vm < 0) { vm = 11; vy--; } if (vm > 11) { vm = 0; vy++; } draw(); }
    else if (t.dataset.v) setV(t.dataset.v);
    else if ('today' in t.dataset) setV(today);
    else if ('clear' in t.dataset) setV('');
    else if ('close' in t.dataset) close();
  });
  draw();
}
document.addEventListener('click', e => {
  const i = e.target.closest && e.target.closest('input[type="date"]');
  if (i) { e.preventDefault(); i.blur(); openCal(i); }
});
/* zoznamy Stav / Aktivita v Sheete sa zmenili → nahradenie starých hodnôt v kontaktoch (aj v Sheete) */
function listMismatches(exact) {
  const out = [];
  [['stav', 'Stav'], ['pozicia', 'Aktivita']].forEach(([k, label]) => {
    const h = S.m[k], list = h && S.data.contacts.lists[h];
    if (!h || !list || !list.length) return;
    const ok = new Set(exact ? list.map(x => String(x).trim()) : list.map(norm)), cnt = new Map();
    S.data.contacts.rows.forEach(r => { const v = String(r.v[h] ?? '').trim(); if (v && !ok.has(exact ? v : norm(v))) cnt.set(v, (cnt.get(v) || 0) + 1); });
    if (cnt.size) out.push({k, label, h, list: list.slice(), items: [...cnt].map(([v, n]) => ({v, n}))});
  });
  return out;
}
function checkLists(force) {
  if (!S.data || !S.data.contacts || document.querySelector('#modal .ovl')) return;
  const mm = listMismatches(!!force);
  if (!mm.length) { if (force) toast('Stav a Aktivita sú zhodné so zoznamami ✔'); return; }
  const sig = JSON.stringify(mm.map(g => g.items.map(i => i.v)));
  if (!force && sessionStorage.getItem('crm.rcskip') === sig) return;
  S.mm = mm; S.mmSig = sig;
  const body = mm.map((g, gi) => `<div class="rcGrp"><b>${esc(g.label)}</b>${g.items.map((it, ii) => {
    const nv = norm(it.v), tok = nv.split(' ')[0], sug = g.list.find(x => norm(x) === nv) || g.list.find(x => norm(x).includes(nv) || nv.includes(norm(x))) || (tok.length > 3 ? g.list.find(x => norm(x).split(' ')[0] === tok) : '') || '';
    return `<div class="rcRow"><span class="rcOld">${esc(it.v)} <small>(${it.n}×)</small></span><span>→</span><select data-rc="${gi}:${ii}"><option value="">ponechať</option>${g.list.map(x => `<option value="${esc(x)}" ${x === sug ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`;
  }).join('')}</div>`).join('');
  modal(`<h3>Zoznamy v Sheete sa zmenili</h3><p class="rcP">V kontaktoch sú hodnoty, ktoré v novom zozname už nie sú. Vyber, čím ich nahradiť – zapíšu sa aj do Sheetu.</p>${body}<div class="rcBtns"><button type="button" class="cta ghost" data-act="rcskip">Neskôr</button><button type="button" class="cta" data-act="rcapply">Aktualizovať kontakty</button></div>`);
}
async function applyLists() {
  const mm = S.mm || []; let total = 0;
  const btn = document.querySelector('[data-act="rcapply"]'); if (btn) { btn.textContent = 'Zapisujem…'; btn.disabled = true; }
  try {
    for (let gi = 0; gi < mm.length; gi++) {
      const g = mm[gi], map = {};
      g.items.forEach((it, ii) => { const sel = document.querySelector(`[data-rc="${gi}:${ii}"]`); if (sel && sel.value) map[it.v] = sel.value; });
      if (!Object.keys(map).length) continue;
      try { await api('bulkrep', {header: g.h, map}); }
      catch (e) {
        if (!/Neznáma akcia/i.test(e.message)) throw e;
        /* starší nasadený skript bez 'bulkrep' – zápis po riadkoch cez 'update' */
        const nm0 = {}; Object.keys(map).forEach(k => nm0[norm(k)] = map[k]);
        const todo = S.data.contacts.rows.filter(r => { const v = norm(r.v[g.h] ?? ''); return v && nm0[v] !== undefined; });
        let i = 0;
        for (const r of todo) {
          i++; if (btn) btn.textContent = 'Zapisujem ' + i + '/' + todo.length + '…';
          await api('update', {sheet: 'contacts', row: r.r, values: {[g.h]: nm0[norm(r.v[g.h])]}});
        }
      }
      const nm = {}; Object.keys(map).forEach(k => nm[norm(k)] = map[k]);
      S.data.contacts.rows.forEach(r => { const v = norm(r.v[g.h] ?? ''); if (v && nm[v] !== undefined) { r.v[g.h] = nm[v]; total++; } });
    }
    persist(); closeModal(); render(); toast(total ? 'Aktualizované: ' + total + ' hodnôt' : 'Nič sa nezmenilo');
  } catch (e) { toast(e.message, true); if (btn) { btn.textContent = 'Aktualizovať kontakty'; btn.disabled = false; } }
}
function companyNames() {
  const m = new Map();
  const add = n => { n = String(n || '').trim(); if (n && !m.has(norm(n))) m.set(norm(n), n); };
  S.data.contacts.rows.forEach(r => add(V(r, 'firma')));
  S.extraCo.forEach(add);
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'sk'));
}

function textHits(name) {
  const n = norm(name); if (n.length < 3 || !S.data) return [];
  const needle = ' ' + n + ' ', out = [];
  for (const r of S.data.contacts.rows) {
    const f = norm(V(r, 'firma')), o = norm(V(r, 'obch')); let why = '';
    if (f && f === n) why = 'rovnaký názov';
    else if (f && ((' ' + f + ' ').includes(needle) || (f.length >= 4 && needle.includes(' ' + f + ' ')))) why = 'podobný názov firmy';
    else if (o && (' ' + o + ' ').includes(needle)) why = 'v názve odberateľa';
    else if (n.length >= 4 && (' ' + (r._s || (r._s = norm(Object.values(r.v).join(' ')))) + ' ').includes(needle)) why = 'nájdené v texte kontaktu';
    if (why) out.push({r, why});
  }

}
function newDupCheck(form) {
  const box = document.getElementById('dupBox'); if (!box || !form) return {block: false, hits: []};
  const val = h => { const e = h && form.querySelector('[data-h="' + CSS.escape(h) + '"]'); return e ? e.value.trim() : ''; };
  const nm = val(S.m.firma), ic = val(S.m.ico);

  const dn = nm ? findDupName(nm) : null;
  if (dn) { block = true; html += `<div class="dupBad">⛔ Firma s názvom „${esc(V(dn, 'firma'))}“ už existuje. Nedá sa uložiť.</div>`; }

  const hits = nm ? textHits(nm).filter(h => !(dn && h.r === dn)) : [];
  if (hits.length) html += `<div class="dupWarn">⚠️ „${esc(nm)}“ sa už v CRM vyskytuje:<ul>${hits.slice(0, 6).map(h => `<li>${esc(V(h.r, 'firma') || '(bez firmy)')} <small>– ${h.why}</small></li>`).join('')}</ul>${hits.length > 6 ? '<small>…a ďalšie</small>' : ''}</div>`;

/* ---------- overenie duplicity pri editácii (názov firmy, Odberateľ, IČO) ---------- */
function editDupMsgs(r, form) {
  const val = h => { const e = h && form.querySelector('[data-h="' + CSS.escape(h) + '"]'); return e ? e.value.trim() : null; };
  const own = norm(V(r, 'firma')), out = [], others = S.data.contacts.rows.filter(x => x.r !== r.r);
  const nm = val(S.m.firma);
  if (nm && norm(nm) !== own) {
    const d = others.find(x => norm(V(x, 'firma')) === norm(nm));
    if (d) out.push(`Firma s názvom „${V(d, 'firma')}“ už existuje.`);
  }
  const ob = val(S.m.obch);
  if (ob && norm(ob).length >= 3 && norm(ob) !== norm(V(r, 'obch'))) {
    const d = others.find(x => norm(V(x, 'firma')) !== own && (norm(V(x, 'firma')) === norm(ob) || norm(V(x, 'obch')) === norm(ob)));
    if (d) out.push(`Odberateľ „${ob}“ už existuje u firmy „${V(d, 'firma') || '(bez firmy)'}“.`);
  }
  const ic = val(S.m.ico);
  if (ic && icoNorm(ic) !== icoNorm(r.v[S.m.ico])) {
    const d = findDupIco(ic, r.r, own);
    if (d) out.push(`IČO ${ic} už má firma „${V(d, 'firma') || '(bez firmy)'}“.`);
  }
  return out;
}

function findDupIco(ico, exceptRow, ownFirma) {

/* ---------- kontrola duplicity ---------- */
function dupReport() {
  const rows = S.data.contacts.rows.filter(r => !r.fd);
  const byIco = new Map(), byName = new Map();
  rows.forEach(r => {
    const i = icoNorm(V(r, 'ico')); if (i.length >= 6) { if (!byIco.has(i)) byIco.set(i, []); byIco.get(i).push(r); }
    const n = norm(V(r, 'firma')); if (n) { if (!byName.has(n)) byName.set(n, []); byName.get(n).push(r); }
  });
  const key = g => g.map(r => r.r).sort((a, b) => a - b).join(',');
  const nameGroups = [...byName.values()].filter(g => g.length > 1), nameKeys = new Set(nameGroups.map(key));
  const icoGroups = [...byIco.entries()].filter(([, g]) => g.length > 1 && !nameKeys.has(key(g)));
  const names = [...byName.keys()].filter(n => n.length >= 5), sim = [];
  for (let i = 0; i < names.length && sim.length < 200; i++) for (let j = 0; j < names.length; j++) {
    if (i === j) continue;
    if (names[i].length < names[j].length || (names[i].length === names[j].length && i > j)) continue;
    if ((' ' + names[i] + ' ').includes(' ' + names[j] + ' ')) { sim.push([names[i], names[j]]); if (sim.length >= 200) break; }
  }
  const item = r => `<div class="dupItem" data-gorow="${r.r}"><b class="firma">${esc(V(r, 'firma') || '(bez firmy)')}</b> <small>${esc(V(r, 'osoba'))}${V(r, 'ico') ? ' · IČO ' + esc(V(r, 'ico')) : ''} · riadok ${r.r}</small></div>`;
  let html = '';
  if (icoGroups.length) html += `<div class="gtitle">Rovnaké IČO (${icoGroups.length})</div>` + icoGroups.map(([i, g]) => `<div class="dupGrp"><small>IČO ${esc(i)}</small>${g.map(item).join('')}</div>`).join('');
  if (nameGroups.length) html += `<div class="gtitle">Rovnaký názov (${nameGroups.length})</div>` + nameGroups.map(g => `<div class="dupGrp">${g.map(item).join('')}</div>`).join('');
  if (sim.length) html += `<div class="gtitle">Podobné názvy (${sim.length})</div>` + sim.map(([a, b]) => `<div class="dupGrp"><small>„${esc(b)}“ je súčasťou „${esc(a)}“</small>${[byName.get(a)[0], byName.get(b)[0]].map(item).join('')}</div>`).join('');
  if (!html) html = '<div class="miss okm">✔ Žiadne duplicity – IČO ani názvy sa nezhodujú.</div>';
  modal(`<div class="mhead"><h2>Kontrola duplicity</h2><button class="ib" data-act="close">${ico('x')}</button></div><p class="rcP">Skontrolovaných ${rows.length} kontaktov. Klikni na kontakt a otvorí sa.</p>${html}`);
}

}

/* ---------- načítanie analýzy z xlsx ---------- */
function anBadge(r) {
  const col = isoDate(V(r, 'an_ok'));
  if (col) return `<span class="anok"><span class="anchk">✔</span><span class="antxt"> Analýza načítaná </span> ${col.split('-').reverse().join('.')}</span>`;
  const f = norm(V(r, 'firma')); if (!f) return '';
  let best = '';
  for (const a of S.data.activities.rows) {
    if (norm(a.v[ACT_H.typ]) !== 'analyza nacitana' || norm(a.v[ACT_H.firma]) !== f) continue;
    const d = isoDate(a.v[ACT_H.dt]); if (d > best) best = d;
  }
  if (!best) return '';
  return `<span class="anok"><span class="anchk">✔</span><span class="antxt"> Analýza načítaná </span> ${best.split('-').reverse().join('.')}</span>`;
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Nepodarilo sa načítať knižnicu pre xlsx (internet?)'));
    document.head.appendChild(sc);
  });
}
function parseAnalysis(wb) {
  const name = wb.SheetNames.find(n => /analyz/.test(norm(n))) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: ''});
  const txt = x => String(x ?? '').trim();
  const nn = x => typeof x === 'number' ? x : num(x);
  const xd = v => { if (typeof v === 'number' && v > 20000) { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; } return isoDate(v); };
  const heads = []; rows.forEach((r, i) => { if (norm(r[0]) === 'om') heads.push(i); });
  if (!heads.length) throw new Error('V súbore som nenašiel tabuľky odberných miest (hlavička „OM #“)');
  // odberateľ (riadky nad prvou tabuľkou: štítok v stĺpci A/B, hodnota vedľa)
  const cust = {}, lab = {odberatel: 'odb', ico: 'ico', ulica: 'ulica', psc: 'psc', mesto: 'mesto'};
  rows.slice(0, heads[0]).forEach(r => {
    for (let c = 0; c < 4; c++) {
      const k = lab[norm(r[c])];
      if (k && cust[k] === undefined) { const v = r.slice(c + 1).find(x => txt(x) !== ''); if (v !== undefined) cust[k] = txt(v); }
    }
  });
  const out = {cust, el: null, pl: null};
  heads.forEach((hi, n) => {
    let kind = null;
    for (let i = hi - 1; i >= Math.max(0, hi - 3) && !kind; i--) {
      const t = norm(rows[i][0]); if (t.includes('elektrin')) kind = 'el'; else if (t.includes('plyn')) kind = 'pl';
    }
    if (!kind) kind = n === 0 ? 'el' : 'pl';
    const hr = rows[hi].map(norm);
    const col = (pat, d) => { const i = hr.findIndex(h => h.includes(pat)); return i >= 0 ? i : d; };
    const cD = col('dodavatel', 2), cS = col('spotreba', 9), cC = col('cena', 11), cK = col('druh', 10), cV = col('do kedy', 8);
    const data = []; let sum = null;
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (norm(r[0]).startsWith('spolu')) { sum = r; break; }
      if (typeof r[0] !== 'number' && !/^\d+$/.test(txt(r[0]))) break;
      data.push(r);
    }
    if (!data.length) return;
    let sp = sum ? nn(sum[cS]) : NaN;
    if (!(sp > 0)) sp = data.reduce((a, r) => a + (nn(r[cS]) || 0), 0);
    let price = sum ? nn(sum[cC]) : NaN;
    if (!(price > 0)) {
      const ok = data.filter(r => nn(r[cS]) > 0 && nn(r[cC]) > 0), fix = ok.filter(r => /fix/.test(norm(r[cK])));
      const base = fix.length ? fix : ok, w = base.reduce((a, r) => a + nn(r[cS]), 0);
      price = w ? base.reduce((a, r) => a + nn(r[cS]) * nn(r[cC]), 0) / w : NaN;
    }
    const dod = [...new Set(data.map(r => txt(r[cD])).filter(Boolean))].join(', ');
    const kons = data.map(r => xd(r[cV])).filter(Boolean).sort();
    const kon = kons[0] || (data.some(r => /neurcit/.test(norm(r[cV]))) ? 'neurčitá' : '');
    const druh = [...new Set(data.map(r => { const t = norm(r[cK]); return t.includes('fix') ? 'Fix' : t.includes('spot') ? 'Spot' : t.includes('kombi') ? 'Kombi' : txt(r[cK]); }).filter(Boolean))].join('/');
    out[kind] = {dod, druh, sp, cs: price, kon, oms: data.length};
  });
  if (!out.el && !out.pl) throw new Error('V súbore som nenašiel údaje o odberných miestach');
  return out;
}
const r3 = x => Math.round(x * 1000) / 1000;
const fmtDec = x => String(r3(x)).replace('.', ',');
async function importAnalysis(file) {
  const r = rowBy(S.sel); if (!r) return;
  document.querySelectorAll('.btn-an').forEach(b => b.disabled = true);
  try {
    toast('Čítam analýzu…');
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const A = parseAnalysis(wb);
    const a = norm(A.cust.odb), b = norm(V(r, 'firma'));
    if (a && b && !a.includes(b) && !b.includes(a) && a.split(' ')[0] !== b.split(' ')[0] &&
        !confirm(`Analýza je pre „${A.cust.odb}“, ale otvorená firma je „${V(r, 'firma')}“.\nPokračovať a zapísať údaje?`)) return;
    const dup = findDupIco(A.cust.ico, r.r, norm(V(r, 'firma')));
    if (dup && !confirm(`⚠️ IČO ${A.cust.ico} z analýzy už má aj firma „${V(dup, 'firma')}“.\nPokračovať a zapísať údaje?`)) return;
    const vals = {};
    const put = (k, v, onlyEmpty) => {
      if (v === '' || v == null || (typeof v === 'number' && !isFinite(v))) return;
      if (onlyEmpty && String(V(r, k)).trim()) return;
      if (k === 'pl_druh' && !S.m.pl_druh) return;
      const h = fieldHeader(k); if (h) vals[h] = v;
    };
    put('obch', A.cust.odb); put('ico', A.cust.ico, true); put('ulica', A.cust.ulica, true); put('psc', A.cust.psc, true); put('mesto', A.cust.mesto, true);
    for (const g of ['el', 'pl']) {
      const x = A[g]; if (!x) continue;
      put(g + '_dod', x.dod); put(g + '_druh', x.druh); put(g + '_sp', isFinite(x.sp) ? r3(x.sp) : null); put(g + '_cs', isFinite(x.cs) ? r3(x.cs) : null);
      if (x.kon) put(g + '_kon', x.kon === 'neurčitá' ? 'neurčitá' : {t: 'd', v: x.kon});
    }
    put('an_ok', {t: 'd', v: todayISO()});
    const real = await materializeNewCols(vals);
    await api('update', {sheet: 'contacts', row: r.r, values: real, activity: actFor(r, 'Analýza načítaná', '', real),
      check: S.m.firma && !r.fd ? {header: S.m.firma, value: V(r, 'firma')} : null});
    setUndo(r, real);
    const local = {}; for (const h in real) local[h] = typeof real[h] === 'number' ? fmtDec(real[h]) : real[h];
    applyLocal(r, local); pushActivity(actFor(r, 'Analýza načítaná', '', real)); persist();
    S.dirty = false; S.tab = 'firma'; renderChips(); renderListBody(); renderDetail();
    const bits = []; if (A.el) bits.push(`elektrina ${fmtDec(A.el.sp)} MWh · ${fmtDec(A.el.cs)} €/MWh`); if (A.pl) bits.push(`plyn ${fmtDec(A.pl.sp)} MWh · ${fmtDec(A.pl.cs)} €/MWh`);
    toast('Analýza načítaná: ' + bits.join(' | '));
  } catch (e) { toast(e.message || String(e), true); if (e.conflict) load(true); }
  finally { document.querySelectorAll('.btn-an').forEach(b => b.disabled = false); }
}

/* Aktivita na iPhone: z formulára Hovor do voľného miesta nad tlačidlom „Načítať analýzu“ */
function placeAct() {
  const pane = document.getElementById('detailPane'); if (!pane) return;
  const slot = pane.querySelector('#actSlot'); if (!slot) return;
  const form = pane.querySelector('#fCall');
  const mob = matchMedia('(max-width:600px)').matches;
  const moved = slot.querySelector('.dtAct');
  if (!form) { if (moved) moved.remove(); return; }
  const inForm = form.querySelector('.dtAct');
  if (mob) {
    if (inForm) {
      if (moved) moved.remove();
      const sel = inForm.querySelector('select'); if (sel) sel.setAttribute('form', 'fCall');
      slot.appendChild(inForm);
    }
  } else if (moved) {
    const row = form.querySelector('.dtRow');
    const sel = moved.querySelector('select'); if (sel) sel.removeAttribute('form');
    if (row) row.appendChild(moved); else moved.remove();
  }
}
try {
  new MutationObserver(placeAct).observe(document.getElementById('detailPane'), {childList: true, subtree: true});
  matchMedia('(max-width:600px)').addEventListener('change', placeAct);
} catch (e) {}
