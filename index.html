<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#0b1d3a">
<title>CRM</title>
<style>
:root{
  --bg:#0b0e18; --panel:#1a2340; --panel2:#1f2a4b; --field:#111833;
  --line:rgba(130,160,255,.18); --blue:#4db8ff; --blue-d:#ebbc5a;
  --teal:#ebbc5a; --teal-d:#c99a35; --orange:#e5605c; --grey:#8b91a1;
  --text:#f0ece4; --muted:#8b91a1; --red:#e5605c; --green:#6fd3b0; --violet:#a78bfa;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.3vw + 13px,18px);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(235,188,90,.07),transparent),var(--bg);
  color:var(--text);font:1rem/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.ico{width:1.35em;height:1.35em;flex:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-rows:1fr auto;height:100dvh}
#main{position:relative;overflow:hidden;display:grid;min-height:0}
.pane{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
#listPane{padding:0 .8rem 1rem}
#listPane>.empty.big{padding-top:calc(env(safe-area-inset-top) + 4rem)}
#detailPane{position:absolute;inset:0;z-index:5;background:var(--bg);transform:translateX(102%);transition:transform .25s ease;
  padding:0 .8rem 1.5rem}
.show-detail #detailPane{transform:none}
#nav{display:flex;justify-content:space-around;background:#0d1226;border-top:1px solid var(--line);
  padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom))}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--muted);
  font-size:.75rem;padding:.3rem .9rem;border-radius:12px;cursor:pointer}
.nb.on{color:var(--teal);background:rgba(235,188,90,.1)}
@media(min-width:900px){
  #app{grid-template-columns:6.2rem 1fr;grid-template-rows:1fr}
  #nav{flex-direction:column;justify-content:flex-start;gap:.4rem;border-top:0;border-right:1px solid var(--line);padding:1rem .5rem}
  #main{grid-template-columns:minmax(21rem,28rem) 1fr;gap:1rem;padding:1rem}
  #listPane,#detailPane{position:static;transform:none;border-radius:20px;border:1px solid var(--line);border-top:3px solid var(--blue);
    background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 14px 40px rgba(0,0,0,.45);padding:0 1.1rem 2rem}
  .back{display:none!important}
}

/* ---------- list ---------- */
.lhead{position:sticky;top:0;z-index:6;margin:0 -.8rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .5rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.lhead{margin:0 -1.1rem;padding:.9rem 1.1rem .5rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.ltitle{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.ltitle h1{font-size:1.35rem;font-weight:750}
.cnt{color:var(--muted);font-size:.85rem}
.sp{flex:1}
.ib{width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;color:var(--text);
  display:grid;place-items:center;cursor:pointer}
.ib.add{background:linear-gradient(135deg,#f2c76a,#ebbc5a);border:0;color:#2a1300}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--grey)}
.dot.ok{background:var(--green)} .dot.sync{background:var(--orange);animation:pulse 1s infinite} .dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;padding:.55rem 0 .1rem}
.chip{flex:none;border:1px solid var(--line);background:#141821;color:var(--text);border-radius:999px;padding:.22rem .6rem;
  font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue-d);border-color:var(--blue)}
.chip.due{border-color:rgba(229,96,92,.6);color:var(--orange)}
.chip.due.on{background:rgba(229,96,92,.22)}
.chip.sm{font-size:.82rem;padding:.28rem .65rem}

.card{display:grid;grid-template-columns:1fr;gap:.7rem;align-items:center;margin:.6rem 0;padding:.8rem .9rem;border-radius:16px;
  background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-left:4px solid var(--blue);cursor:pointer}
.card.over{border-left-color:var(--orange)} .card.today{border-left-color:var(--teal)}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.c-top{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.c-firma{font-size:1rem}
.c-sub{color:var(--muted);font-size:.85rem;margin-top:.1rem}
.c-bot{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-top:.3rem;font-size:.85rem}
.c-next{color:var(--text);opacity:.85}
.when{font-weight:650}
.when.over{color:var(--orange)} .when.today{color:var(--teal)} .when.fut{color:#4db8ff} .when.none{color:var(--muted);font-weight:400}
.qcall{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f2c76a,var(--teal-d));
  color:#2a1f05;text-decoration:none;box-shadow:0 6px 16px rgba(235,188,90,.25)}
.badge{display:inline-block;border-radius:999px;padding:.12rem .65rem;font-size:.75rem;font-weight:600;color:var(--c);background:var(--cb);border:1px solid var(--c)}
.b-teal{--c:#1fd6c8;--cb:rgba(235,188,90,.12)} .b-orange{--c:#ff9f3d;--cb:rgba(229,96,92,.12)}
.b-red{--c:#ff6b6b;--cb:rgba(255,107,107,.12)} .b-green{--c:#3ddc84;--cb:rgba(61,220,132,.12)}
.b-blue{--c:#6aa5ff;--cb:rgba(59,130,246,.15)} .b-violet{--c:#a78bfa;--cb:rgba(167,139,250,.12)} .b-grey{--c:#9aa6b8;--cb:rgba(140,152,171,.12)}
.more{width:100%;margin:.6rem 0;padding:.8rem;border-radius:14px;border:1px dashed var(--line);background:none;cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);padding:1rem .2rem}
.empty.big{text-align:center;padding:4rem 1rem;font-size:1.1rem}

/* ---------- detail ---------- */
.dhead{position:sticky;top:0;z-index:6;display:flex;align-items:flex-start;gap:.7rem;margin:0 -.8rem .4rem;padding:calc(env(safe-area-inset-top) + .5rem) .8rem .6rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.08)}
@media(min-width:900px){.dhead{margin:0 -1.1rem .4rem;padding:.9rem 1.1rem .6rem;background:var(--panel2);border-radius:20px 20px 0 0}}
.dhead h2{font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.dhead .sub{color:var(--muted);margin-top:.15rem}
.back{flex:none;width:2.5rem;height:2.5rem;border-radius:14px;border:1px solid var(--line);background:#141821;display:grid;place-items:center;cursor:pointer}
.calls{display:grid;gap:.8rem;grid-template-columns:1fr;margin:.3rem 0 .9rem}
@media(min-width:600px){.calls.two{grid-template-columns:3fr 2fr}}
.call{display:flex;align-items:center;justify-content:center;gap:.7rem;text-decoration:none;border-radius:18px;font-weight:750;min-height:3.4rem;padding:.4rem 1rem}
.call.main{background:linear-gradient(135deg,#f2c76a,var(--teal-d));color:#2a1f05;font-size:1.3rem;box-shadow:0 10px 28px rgba(235,188,90,.3)}
.call.alt{background:#1a2538;border:1px solid #44556f;color:#d4dcea;font-size:1rem}
.callnote{color:var(--orange);font-size:.85rem;margin-top:.35rem;padding:0 .3rem}
.links{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.lnk{display:inline-flex;align-items:center;gap:.4rem;color:#4db8ff;text-decoration:none;font-size:.88rem;border:1px solid var(--line);border-radius:12px;padding:.35rem .7rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:.9rem;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-size:.9rem;padding:.5rem .8rem;cursor:pointer;font-weight:600;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.win{background:linear-gradient(180deg,#222e52,#1b2544);border:1px solid var(--line);border-top:2px solid var(--blue);border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pad{padding:1rem}
label{display:block;color:var(--muted);font-size:.82rem;margin:.1rem 0 .8rem}
input,select,textarea{display:block;width:100%;margin-top:.3rem;background:var(--field);border:1px solid rgba(255,255,255,.12);border-radius:12px;
  color:var(--text);padding:.55rem .75rem;min-height:2.6rem;color-scheme:dark;min-width:0;font-size:max(16px,1rem)}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(235,188,90,.18)}
input[readonly]{opacity:.7}
.dt{display:grid;grid-template-columns:3fr 2fr;gap:.7rem}
.qd{display:flex;gap:.4rem;flex-wrap:wrap;margin:-.3rem 0 .8rem}
.qn{display:flex;gap:.4rem;flex-wrap:wrap;margin:-.3rem 0 .8rem}
.cta{width:100%;min-height:3rem;border:0;border-radius:14px;font-weight:750;font-size:1rem;cursor:pointer;
  background:linear-gradient(135deg,#f2c76a,#ebbc5a);color:#2a1300;box-shadow:0 8px 22px rgba(235,188,90,.25)}
.cta:disabled{opacity:.6}
.cta.stick{position:sticky;bottom:.5rem;z-index:4;box-shadow:0 0 0 .5rem rgba(11,29,58,.85),0 8px 22px rgba(229,96,92,.3)}
.btn-sm{margin-left:auto;border:0;border-radius:10px;padding:.35rem .8rem;font-size:.82rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f2c76a,var(--teal-d));color:#2a1f05}
.btn-sm:disabled{opacity:.6}
.qn{align-items:center}
.dgrp{margin:.9rem .2rem .1rem;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dgrp.over{color:var(--orange)}
.dgrp.today{color:#2a1f05;background:var(--teal);display:inline-block;padding:.15rem .7rem;border-radius:999px;margin-left:0}
.card.today{background:linear-gradient(180deg,rgba(235,188,90,.22),rgba(235,188,90,.07));border-color:rgba(235,188,90,.65);border-left-color:var(--teal)}
.sts{display:flex;gap:.3rem;flex-wrap:wrap}
.cta.ghost{background:#141821;color:var(--text);box-shadow:none;border:1px solid var(--line)}
.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:.9rem 0 0;padding:.8rem .9rem;font:inherit;font-size:.88rem;color:#cdd7e6}
.gtitle{color:var(--teal);font-weight:700;margin:.4rem 0 .6rem;font-size:.95rem}
.saveOut{margin:.2rem 0 1rem;padding:.7rem .9rem;border-radius:12px;background:rgba(229,96,92,.1);border:1px solid rgba(229,96,92,.4);color:var(--orange)}
.hist{padding:.7rem .9rem;margin:.5rem 0;border-radius:14px;background:#141b34;border:1px solid var(--line)}
.hist .h-top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.hist .h-txt{font-size:.9rem}
.hist .h-txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:.25rem}
.ph{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;min-height:14rem}

/* ---------- modal / toast ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.72);display:grid;place-items:center;padding:1rem;backdrop-filter:blur(4px)}
.modal{width:min(40rem,100%);max-height:92dvh;overflow:auto;padding:1.1rem 1.2rem 1.3rem}
.mhead{display:flex;align-items:center;margin-bottom:.8rem}
.mhead h2{flex:1;font-size:1.2rem}
.maprow{display:grid;grid-template-columns:1fr 1.4fr;gap:.6rem;align-items:center;margin:.4rem 0}
.maprow span{color:var(--muted)}
.maprow select{margin:0}
#toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:#1a1810;border:1px solid var(--teal);color:var(--text);padding:.7rem 1.1rem;border-radius:14px;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1} #toast.err{background:#2a1412;border-color:var(--orange)}
@media(min-width:900px){#toast{bottom:2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chip.on{background:#ebbc5a;border-color:#ebbc5a;color:#1a1405}
.c-firma{color:#4db8ff}
.nb.on{color:#ebbc5a}
.pick{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .2rem}
.pick button{border:2px solid transparent;border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.88rem;cursor:pointer;opacity:.45;font-family:inherit}
.pick button.on{opacity:1;border-color:#f0ece4}
.sts2{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.chips .chip,.chips select{padding:.5rem .4rem;font-size:.9rem;font-weight:700;text-align:center;border-radius:14px;min-height:0;margin:0;width:100%}
.chips select{appearance:none;-webkit-appearance:none;background:#141821;color:var(--text);border:1px solid var(--line);text-align-last:center}
.chips select.on{border-color:#6fd3b0;color:#6fd3b0}
.stsel,.actsel{appearance:auto;border:1px solid transparent;font-weight:700;color-scheme:dark}
.stsel{width:auto;margin:0;min-height:2rem;border-radius:999px;padding:.25rem .6rem;font-size:.85rem;background:#2a3358;color:#f0ece4}
.actsel{background:#2a3358;color:#f0ece4}
.stsel option,.actsel option{background:#1b2440;color:#f0ece4}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <div id="main">
    <section id="listPane" class="pane"></section>
    <section id="detailPane" class="pane"></section>
  </div>
</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
/* =========================================================
   CRM – single-file app (GitHub Pages) + Apps Script API
   ========================================================= */
/* ===== PRIPOJENIE – vlož sem URL z Apps Scriptu (…/exec), potom sa už nič nezadáva ===== */
const CRM_URL = '';
const LS = localStorage;
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return iso(d); };
const dmy = (d = new Date()) => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const nowISO = () => { const d = new Date(); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const num = s => parseFloat(String(s ?? '').replace(/\s/g, '').replace(',', '.'));
const fmtNum = n => Math.round(n).toLocaleString('sk-SK');

const ICONS = {
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

/* ---------- stav ---------- */
const S = {
  cfg: (() => { const c = JSON.parse(LS.getItem('crm.cfg') || '{}'); return {url: CRM_URL || c.url || '', token: ''}; })(),
  map: JSON.parse(LS.getItem('crm.map') || '{}'),
  data: null, m: {}, auto: {},
  view: 'contacts', q: '', chip: 'all', sel: null, tab: 'hovor',
  dirty: false, limit: 150, lastLoad: 0, extraCo: new Set()
};
if (location.hash.startsWith('#cfg=')) {
  try { S.cfg = JSON.parse(atob(location.hash.slice(5))); LS.setItem('crm.cfg', JSON.stringify(S.cfg)); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
}
try { const c = LS.getItem('crm.cache'); if (c) S.data = JSON.parse(c); } catch (e) {}

/* polia hlavnej tabuľky – poradie je dôležité (prvé sa priraďujú) */
const FIELDS = [
  {k:'datum',  label:'Dátum ďalšej komunikácie', pats:['datum dalsej komunikacie','datum','date']},
  {k:'cas',    label:'Čas', pats:['cas','time']},
  {k:'tel2',   label:'Telefón 2', pats:['telefon 2','tel 2','tel2','telefon2','mobil 2','druhy telefon']},
  {k:'tel',    label:'Telefón (hlavný)', pats:['telefon 1','telefon','tel','mobil','phone','cislo']},
  {k:'email',  label:'E-mail', pats:['e mail','email','mail']},
  {k:'stav',   label:'Stav', pats:['stav','status']},
  {k:'dalsi',  label:'Čo nasleduje', pats:['co nasleduje','dalsi krok','nasleduje','akcia','next','uloha']},
  {k:'pozn',   label:'Poznámka', pats:['poznamka','poznamky','notes','note']},
  {k:'firma',  label:'Firma', pats:['nazov spolocnosti','spolocnost','firma','company','nazov']},
  {k:'osoba',  label:'Kontaktná osoba', pats:['kontaktna osoba','meno a priezvisko','meno','kontakt','osoba','priezvisko']},
  {k:'pozicia',label:'Aktivita', pats:['aktivita','pozicia','funkcia']}
];
const ACT_H = {dt:'Dátum a čas', firma:'Firma', kontakt:'Kontakt', typ:'Typ', stav:'Stav', pozn:'Poznámka', dalsi:'Ďalší krok', dalsiK:'Ďalší kontakt'};
const CGROUPS = [
  ['Analýza', ['Úspora (€/rok)','Poznámka k analýze']],
  ['Základné údaje', ['Firma','IČO','Web','Adresa','Mesto','Odvetvie']],
  ['Elektrina', ['Dodávateľ el.','Spotreba el. (MWh/rok)','Cena el. súčasná (€/MWh)','Cena el. ponuka (€/MWh)','Koniec zmluvy el.']],
  ['Plyn', ['Dodávateľ plyn','Spotreba plyn (MWh/rok)','Cena plyn súčasná (€/MWh)','Cena plyn ponuka (€/MWh)','Koniec zmluvy plyn']]
];
const QUICK_NOTES = ['Čakám na FA', 'Dohodnúť stretnutie', 'Pripraviť ponuku'];
const SEP = '────────────────';

function buildMap() {
  if (!S.data) return;
  const hs = S.data.contacts.headers, nh = hs.map(norm), used = new Set(), auto = {};
  for (const f of FIELDS) {
    let i = -1;
    for (const p of f.pats) { i = nh.findIndex((h, x) => !used.has(x) && h === p); if (i >= 0) break; }
    if (i < 0) for (const p of f.pats) { i = nh.findIndex((h, x) => !used.has(x) && h.includes(p)); if (i >= 0) break; }

  m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4}|\d{2})(?!\d)/);
  return m ? `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}` : '';
}

/* ---------- API ---------- */
async function api(action, payload = {}) {
  if (!S.cfg.url) throw new Error('Chýba URL – otvor Nastavenia');
  const body = JSON.stringify({token: S.cfg.token, action, ...payload});
  const tries = action === 'read' || action === 'ping' ? 4 : 1;   // čítanie sa bezpečne opakuje, zápis nie
  let last;
  for (let i = 0; i < tries; i++) {
    if (i) await new Promise(r => setTimeout(r, 700 * i));
    try {
      const res = await fetch(S.cfg.url, {method: 'POST', redirect: 'follow', body});
      const txt = await res.text();
      let j; try { j = JSON.parse(txt); } catch (e) {
        last = new Error('Server nevrátil JSON (' + res.status + '): ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140));
        continue;
      }
      if (!j.ok) { const e = new Error(j.error || 'Chyba servera'); e.conflict = j.conflict; throw e; }
      return j;
    } catch (e) {
      if (e.conflict !== undefined || tries === 1 || /^Chyba|Neplatn|Riadok|Záložka|Neznáma/.test(e.message)) throw e;
      last = e;
    }
  }
  throw last;
}

    : st === 'sync' ? 'Načítavam zo Sheetu…' : (msg || 'Chyba');
  el.innerHTML = `<span class="dot ${st}"></span>${esc(t)}`;

function companyBlock(name) {

  const val = h => h === 'Firma' ? (row ? row.v['Firma'] : name) : (row ? (row.v[h] ?? '') : '');
  let html = `<form id="fComp" class="win pad" data-name="${esc(name)}" autocomplete="off">`;
  for (const [g, hs] of CGROUPS) {

function calcSavings(form) {

  const el = (g('Cena el. súčasná (€/MWh)') - g('Cena el. ponuka (€/MWh)')) * g('Spotreba el. (MWh/rok)');
  const gas = (g('Cena plyn súčasná (€/MWh)') - g('Cena plyn ponuka (€/MWh)')) * g('Spotreba plyn (MWh/rok)');
  const parts = [el, gas].filter(Number.isFinite), out = $('#saveOut', form);

  const tot = parts.reduce((a, b) => a + b, 0);

  const u = form.querySelector('[data-h="Úspora (€/rok)"]');

function collect(form) {

const specVal = s => (s && typeof s === 'object') ? s.v : s;
function differs(cur, spec) {

  return String(cur) !== spec;
}
function changedOnly(row, vals) {

}

function actFor(r, typ, note, vals) {

  const d = isoDate(g('datum')), t = isoTime(g('cas'));

}

  if (t.classList.contains('actsel')) t.setAttribute('style', palStyle(t.value));
  if (t.dataset.map) {
    const v = t.value; if (v === '__auto') delete S.map[t.dataset.map]; else S.map[t.dataset.map] = v === '__none' ? '' : v;
    LS.setItem('crm.map', JSON.stringify(S.map)); buildMap(); render();
  }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { const f = e.target.closest('form'); if (f) f.requestSubmit(); }
  if (e.key === 'Escape') closeModal();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.cfg.url && !S.dirty && Date.now() - S.lastLoad > 120000) load(true);
});
// po vykreslení formulára firmy prepočítaj úsporu
new MutationObserver(() => { const f = $('#fComp'); if (f && !f.dataset.init) { f.dataset.init = '1'; calcSavings(f); } })
  .observe($('#detailPane'), {childList: true, subtree: true});

/* ---------- ikona pre plochu iOS ---------- */
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#f2c76a'); g.addColorStop(1, '#c99a35');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180); x.fillStyle = '#071018'; x.font = '800 62px -apple-system,Helvetica,Arial';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('CRM', 90, 94);
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
})();

/* ---------- štart ---------- */
buildMap(); render();
if (!S.cfg.url) openSettings(); else load();
</script>
</body>
</html>
